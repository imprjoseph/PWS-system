        /* 鎖定狀態的 Range 樣式 */

        input[type=range]:disabled::-webkit-slider-runnable-track { cursor: not-allowed; }

<body>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        
        // --- 原生日曆輔助函式 ---
        const parseISO = str => new Date(str);
        const startOfWeek = date => { const d = new Date(date); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d; };
        const endOfWeek = date => { const d = new Date(date); d.setHours(23,59,59,999); d.setDate(d.getDate() + (6 - d.getDay())); return d; };
        const addDays = (date, amount) => { const d = new Date(date); d.setDate(d.getDate() + amount); return d; };
        const startOfMonth = date => new Date(date.getFullYear(), date.getMonth(), 1);
        const endOfMonth = date => new Date(date.getFullYear(), date.getMonth() + 1, 0, 23, 59, 59, 999);
        const isSameMonth = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth();
        const isSameDay = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
        const isWithinInterval = (date, {start, end}) => {
            const d = new Date(date).setHours(0,0,0,0);
            const s = new Date(start).setHours(0,0,0,0);
            const e = new Date(end).setHours(23,59,59,999);
            return d >= s && d <= e;
        };
        const startOfYear = date => new Date(date.getFullYear(), 0, 1);
        const endOfYear = date => new Date(date.getFullYear(), 11, 31, 23, 59, 59, 999);
        const format = (date, formatStr) => {
            if(formatStr === 'd') return date.getDate().toString();
            if(formatStr === 'yyyy 年 MM 月') {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                return `${y} 年 ${m} 月`;
            }
            return date.toString();
        };

        const logoUrl = "logo.png";

            { code: '3.6', name: '出席名單最終版' },
            { code: '4', name: 'AV 技術整合' },

            { code: '11.5', name: '編號與張貼位置對應表' },

            { code: '11.7', name: '張貼與撤場時間規劃' }
        ];

        const IMPR_LOGO_SVG = (className = "w-12 h-12") => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="rgba(242, 140, 0, 0.1)"/>
                <path d="M12 8v4M12 16h.01" stroke="#F28C00" strokeWidth="3"/>
                <circle cx="12" cy="12" r="10" stroke="#F28C00" strokeWidth="1" opacity="0.3" />
            </svg>
        );

        // --- 輔助函式：取得正確大小寫的負責人名稱 ---
        const getAssigneeValue = (members, assigneeStr) => {
            if (!assigneeStr) return "";
            const match = String(assigneeStr).trim().toLowerCase();
            const member = members.find(m => 
                String(m.name || '').trim().toLowerCase() === match || 
                String(m.username || '').trim().toLowerCase() === match
            );
            return member ? String(member.name || member.username).trim() : String(assigneeStr).trim();
        };

        // --- API 呼叫模組 ---
        const callGAS = async (payload) => { 
            if (!GAS_API_URL) {
                console.warn("未設定 GAS_API_URL，使用本地模擬模式"); 
                return { status: 'success' }; 
            }
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    redirect: 'follow'
                });
                return await response.json();
            } catch (error) {
                console.error("API 呼叫失敗:", error);
                return { status: 'error', message: error.toString() };
            }
        };

        // --- 元件: 登入頁 ---
        const LoginPage = ({ onLogin, loading, error }) => {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const [imgError, setImgError] = useState(false);
            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4 sm:p-6">

                            {!imgError ? <img src={logoUrl} className="company-logo mx-auto" onError={() => setImgError(true)} alt="IMPR Logo" /> : <div className="flex flex-col items-center">{IMPR_LOGO_SVG("w-14 h-14")}<span className="font-black text-2xl text-impr-orange mt-2 italic tracking-tighter">IMPR</span></div>}

                            <input type="password" value={p} onChange={e=>setP(e.target.value)} className="w-full px-5 py-3 sm:px-6 sm:py-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold outline-none focus:ring-4 focus:ring-impr-orange/10 focus:border-impr-orange transition-all" placeholder="Password (預設: 123)" />
                        </div>
                        {error && <div className="text-red-500 text-xs font-bold mt-4 bg-red-50 p-2 rounded">{error}</div>}
                        <button onClick={() => onLogin(u, p)} disabled={loading} className="w-full mt-8 py-3.5 sm:py-4 bg-impr-orange text-white font-black rounded-2xl hover:bg-orange-600 transition-all shadow-lg active:scale-95">{loading ? "連線驗證中..." : "登入系統"}</button>
                    </div>
                </div>

        };

        // --- 元件: 統計儀表板 ---
        const DashboardStats = ({ activities }) => {
            const total = activities.length;
            const ongoing = activities.filter(a => !['已完工', '結案'].includes(a.status)).length;
            const completed = activities.filter(a => ['已完工', '結案'].includes(a.status)).length;
            return (
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 sm:mb-8">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4"><div className="p-3 bg-blue-50 rounded-xl text-blue-600"><i data-lucide="folder-open" className="w-5 h-5"></i></div><div><p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">總專案數</p><p className="text-xl sm:text-2xl font-black text-slate-800">{total}</p></div></div>
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4"><div className="p-3 bg-impr-orange/10 rounded-xl text-impr-orange"><i data-lucide="activity" className="w-5 h-5"></i></div><div><p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">執行中</p><p className="text-xl sm:text-2xl font-black text-slate-800">{ongoing}</p></div></div>
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4"><div className="p-3 bg-emerald-50 rounded-xl text-emerald-600"><i data-lucide="check-circle-2" className="w-5 h-5"></i></div><div><p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">已完工</p><p className="text-xl sm:text-2xl font-black text-slate-800">{completed}</p></div></div>
                </div>
            );
        };

        // --- 元件: 專案行事曆 ---
        const ProjectCalendar = ({ activities }) => {
            const [currentMonth, setCurrentMonth] = useState(new Date());
            
            const ongoingActivities = activities.filter(a => ['籌備中', '進行中'].includes(a.status) && a.startDate && a.endDate);
            
            const nextMonth = () => setCurrentMonth(addDays(currentMonth, 30));
            const prevMonth = () => setCurrentMonth(addDays(currentMonth, -30));

            const monthStart = startOfMonth(currentMonth);
            const monthEnd = endOfMonth(monthStart);
            const startDate = startOfWeek(monthStart);
            const endDate = endOfWeek(monthEnd);

            const dateFormat = "d";
            const rows = [];
            let days = [];
            let day = startDate;
            let formattedDate = "";

            const colors = ['bg-blue-500', 'bg-emerald-500', 'bg-violet-500', 'bg-rose-500', 'bg-amber-500'];

            while (day <= endDate) {
                for (let i = 0; i < 7; i++) {
                    formattedDate = format(day, dateFormat);
                    const cloneDay = day;
                    
                    const dayActivities = ongoingActivities.filter(act => {
                        const actStart = parseISO(act.startDate);
                        const actEnd = parseISO(act.endDate);
                        return isWithinInterval(cloneDay, { start: actStart, end: actEnd });
                    });

                    days.push(
                        <div className={`min-h-[100px] p-2 border border-slate-100 ${!isSameMonth(day, monthStart) ? 'bg-slate-50 text-slate-400' : 'bg-white'}`} key={day.toString()}>
                            <span className={`text-sm font-bold block mb-1 ${isSameDay(day, new Date()) ? 'text-impr-orange' : 'text-slate-700'}`}>{formattedDate}</span>
                            <div className="space-y-1">
                                {dayActivities.map((act, idx) => (
                                    <div key={act.id} className={`text-[10px] text-white px-1.5 py-0.5 rounded truncate ${colors[idx % colors.length]}`}>
                                        {act.name}
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                    day = addDays(day, 1);
                }
                rows.push(<div className="grid grid-cols-7" key={day.toString()}>{days}</div>);
                days = [];
            }

            return (
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-black text-slate-800">專案排程行事曆</h2>
                        <div className="flex items-center gap-4">
                            <button onClick={prevMonth} className="p-2 bg-slate-100 rounded-lg hover:bg-slate-200"><i data-lucide="chevron-left" className="w-5 h-5"></i></button>
                            <span className="font-bold text-lg">{format(currentMonth, 'yyyy 年 MM 月')}</span>
                            <button onClick={nextMonth} className="p-2 bg-slate-100 rounded-lg hover:bg-slate-200"><i data-lucide="chevron-right" className="w-5 h-5"></i></button>
                        </div>
                    </div>
                    <div className="grid grid-cols-7 gap-px bg-slate-200 border border-slate-200 rounded-xl overflow-hidden">
                        {['日', '一', '二', '三', '四', '五', '六'].map(d => (
                            <div key={d} className="bg-slate-50 py-2 text-center text-xs font-bold text-slate-500">{d}</div>
                        ))}
                        <div className="col-span-7 bg-slate-200 gap-px flex flex-col">
                           {rows}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 元件: 數據分析報表 ---
        const ReportsManager = ({ activities, tasks, teamMembers }) => {
            const today = new Date();
            
            const activeProjects = activities.filter(a => ['籌備中', '進行中'].includes(a.status));
            const completedProjects = activities.filter(a => ['已完工', '結案'].includes(a.status));
            
            const isThisWeek = (dateStr) => dateStr && parseISO(dateStr) >= startOfWeek(today) && parseISO(dateStr) <= endOfWeek(today);
            const isThisMonth = (dateStr) => dateStr && isSameMonth(parseISO(dateStr), today);
            const isThisYear = (dateStr) => dateStr && parseISO(dateStr) >= startOfYear(today) && parseISO(dateStr) <= endOfYear(today);

            const timeStats = {
                week: { active: activeProjects.filter(a => isThisWeek(a.startDate)).length, completed: completedProjects.filter(a => isThisWeek(a.endDate)).length },
                month: { active: activeProjects.filter(a => isThisMonth(a.startDate)).length, completed: completedProjects.filter(a => isThisMonth(a.endDate)).length },
                year: { active: activeProjects.filter(a => isThisYear(a.startDate)).length, completed: completedProjects.filter(a => isThisYear(a.endDate)).length },
            };

            const memberStats = teamMembers.map(member => {
                const memberTasks = tasks.filter(t => (t.assignee || '').toLowerCase() === member.name.toLowerCase() || (t.assignee || '').toLowerCase() === member.username.toLowerCase());
                const completedCount = memberTasks.filter(t => t.status === 100).length;
                const ongoingCount = memberTasks.filter(t => t.status < 100).length;
                return { name: member.name, completed: completedCount, ongoing: ongoingCount };
            });

            return (
                <div className="space-y-6">
                    <h2 className="text-xl font-black text-slate-800 mb-4">數據分析報表</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="text-sm font-bold text-slate-500 mb-4 flex items-center gap-2"><i data-lucide="calendar" className="w-4 h-4 text-blue-500"></i> 本週專案動態</h3>
                            <div className="flex justify-between items-end">
                                <div><p className="text-3xl font-black text-slate-800">{timeStats.week.active}</p><p className="text-xs text-slate-400 font-bold mt-1">新增進行中</p></div>
                                <div><p className="text-3xl font-black text-emerald-600 text-right">{timeStats.week.completed}</p><p className="text-xs text-slate-400 font-bold mt-1">本週完工</p></div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="text-sm font-bold text-slate-500 mb-4 flex items-center gap-2"><i data-lucide="calendar" className="w-4 h-4 text-impr-orange"></i> 本月專案動態</h3>
                            <div className="flex justify-between items-end">
                                <div><p className="text-3xl font-black text-slate-800">{timeStats.month.active}</p><p className="text-xs text-slate-400 font-bold mt-1">新增進行中</p></div>
                                <div><p className="text-3xl font-black text-emerald-600 text-right">{timeStats.month.completed}</p><p className="text-xs text-slate-400 font-bold mt-1">本月完工</p></div>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="text-sm font-bold text-slate-500 mb-4 flex items-center gap-2"><i data-lucide="calendar" className="w-4 h-4 text-purple-500"></i> 本年度專案動態</h3>
                            <div className="flex justify-between items-end">
                                <div><p className="text-3xl font-black text-slate-800">{timeStats.year.active}</p><p className="text-xs text-slate-400 font-bold mt-1">新增進行中</p></div>
                                <div><p className="text-3xl font-black text-emerald-600 text-right">{timeStats.year.completed}</p><p className="text-xs text-slate-400 font-bold mt-1">年度完工</p></div>
                            </div>
                        </div>
                    </div>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center gap-2"><i data-lucide="bar-chart-2" className="text-impr-orange"></i> 團隊成員任務統計 (本年度)</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead>
                                    <tr className="border-b border-slate-200 text-slate-500">
                                        <th className="pb-3 font-bold">成員姓名</th>
                                        <th className="pb-3 font-bold">執行中任務數</th>
                                        <th className="pb-3 font-bold">已完成任務數</th>
                                        <th className="pb-3 font-bold">總任務達成率</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {memberStats.map((member, idx) => {
                                        const total = member.completed + member.ongoing;
                                        const rate = total > 0 ? Math.round((member.completed / total) * 100) : 0;
                                        return (
                                            <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                                <td className="py-4 font-bold text-slate-700">{member.name}</td>
                                                <td className="py-4 font-black text-blue-600">{member.ongoing}</td>
                                                <td className="py-4 font-black text-emerald-600">{member.completed}</td>
                                                <td className="py-4">
                                                    <div className="flex items-center gap-2">
                                                        <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden max-w-[100px]">
                                                            <div className="h-full bg-emerald-500" style={{ width: `${rate}%` }}></div>
                                                        </div>
                                                        <span className="text-xs font-bold text-slate-500">{rate}%</span>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const TeamManager = ({ members, setMembers }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [editId, setEditId] = useState(null);
            const [formData, setFormData] = useState({ username: '', password: '', role: '', name: '' });

            const handleSubmit = () => {
                if(!formData.username || !formData.name) return alert('Username與Name為必填');
                
                let updatedMembers;
                if (editId) {
                    updatedMembers = members.map(m => m.id === editId ? { ...m, ...formData } : m);
                    callGAS({ action: 'updateMember', oldUsername: members.find(m => m.id === editId).username, ...formData });
                } else {
                    const newMember = { id: Date.now(), ...formData };
                    updatedMembers = [...members, newMember];
                    callGAS({ action: 'addMember', ...formData });
                }
                
                setMembers(updatedMembers);
                resetForm();
            };

            const handleEdit = (member) => {
                setFormData({ username: member.username, password: member.password, role: member.role, name: member.name });
                setEditId(member.id);
                setIsEditing(true);
            };

            const handleDelete = (id) => {
                if(confirm('確定刪除此成員？')) {
                    const memberToDelete = members.find(m => m.id === id);
                    setMembers(prev => prev.filter(m => m.id !== id));
                    callGAS({ action: 'deleteMember', username: memberToDelete.username });
                }
            };

            const resetForm = () => {
                setFormData({ username: '', password: '', role: '', name: '' });
                setEditId(null);
                setIsEditing(false);
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xl font-black text-slate-800">團隊成員管理</h2>
                        <button onClick={() => setIsEditing(true)} className="px-4 py-2 bg-impr-orange text-white rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-orange-600 transition-colors"><i data-lucide="user-plus" className="w-4 h-4"></i> 新增成員</button>
                    </div>
                    {isEditing && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 animate-in slide-in-from-top-2">
                            <h3 className="font-bold text-slate-700 mb-4">{editId ? '編輯成員資料' : '新增團隊成員'}</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                                <input type="text" placeholder="Username (帳號)" className="p-3 border rounded-xl text-sm outline-none focus:border-impr-orange" value={formData.username} onChange={e=>setFormData({...formData, username: e.target.value})} />
                                <input type="text" placeholder="Password (密碼)" className="p-3 border rounded-xl text-sm outline-none focus:border-impr-orange" value={formData.password} onChange={e=>setFormData({...formData, password: e.target.value})} />
                                <input type="text" placeholder="Role (admin/staff)" className="p-3 border rounded-xl text-sm outline-none focus:border-impr-orange" value={formData.role} onChange={e=>setFormData({...formData, role: e.target.value})} />
                                <input type="text" placeholder="Name (顯示名稱)" className="p-3 border rounded-xl text-sm outline-none focus:border-impr-orange" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} />
                            </div>
                            <div className="flex gap-3">
                                <button onClick={handleSubmit} className="px-6 py-2 bg-slate-800 text-white rounded-xl text-sm font-bold hover:bg-slate-700">確認{editId ? '變更' : '新增'}</button>
                                <button onClick={resetForm} className="px-6 py-2 bg-slate-100 text-slate-500 rounded-xl text-sm font-bold hover:bg-slate-200">取消</button>
                            </div>
                        </div>
                    )}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {members.length === 0 ? (
                            <div className="col-span-full p-8 text-center text-slate-400 italic">尚無團隊成員資料。</div>
                        ) : members.map(m => (
                            <div key={m.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between group hover:border-impr-orange/30 transition-all">
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-500">{m.name && m.name[0] ? m.name[0].toUpperCase() : '?'}</div>
                                    <div><p className="font-bold text-slate-800">{m.name}</p><p className="text-xs text-slate-400">@{m.username} • {m.role}</p></div>
                                </div>
                                <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onClick={() => handleEdit(m)} className="p-2 text-slate-400 hover:text-blue-500 hover:bg-blue-50 rounded-lg transition-colors"><i data-lucide="edit-2" className="w-4 h-4"></i></button>
                                    <button onClick={() => handleDelete(m.id)} className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- 核心：與團隊名單連動的任務元件 ---
        const TaskHierarchy = ({ tasks, user, members, onUpdate }) => {
            const { parents, childrenMap } = useMemo(() => {
                const parents = [];
                const childrenMap = {};
                const allCodes = new Set(tasks.map(t => String(t.code)));
                const sortedTasks = [...tasks].sort((a, b) => {
                    const pa = String(a.code).split('.').map(Number);
                    const pb = String(b.code).split('.').map(Number);
                    for (let i = 0; i < Math.max(pa.length, pb.length); i++) { if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0); }
                    return 0;
                });
                sortedTasks.forEach(t => {
                    const codeStr = String(t.code);
                    const isChild = codeStr.includes('.');
                    const pCode = isChild ? codeStr.split('.')[0] : null;
                    if (isChild && allCodes.has(pCode)) {
                        if (!childrenMap[pCode]) childrenMap[pCode] = [];
                        childrenMap[pCode].push(t);
                    } else { parents.push(t); }
                });
                return { parents, childrenMap };
            }, [tasks]);

            if (parents.length === 0) return <div className="p-8 text-center text-slate-300 italic text-sm">暫無任務</div>;

            const checkDelay = (task) => {
                if (task.status < 100 && task.dueDate) {
                    const due = new Date(task.dueDate);
                    const today = new Date();
                    today.setHours(0,0,0,0);
                    return due < today;
                }
                return false;
            };

            const checkPermission = (assigneeName) => {
                if (user?.role === 'admin') return true;
                if (!assigneeName || String(assigneeName).trim() === '') return true; 
                return user?.name?.toLowerCase() === String(assigneeName).toLowerCase() || 
                       user?.username?.toLowerCase() === String(assigneeName).toLowerCase();
            };

            return (
                <div className="space-y-4">
                    {parents.map(parent => {
                        const children = childrenMap[parent.code] || [];
                        const activeChildren = children.filter(c => c.isApplicable);
                        const progress = activeChildren.length > 0 ? Math.round(activeChildren.reduce((acc, curr) => acc + (Number(curr.status)||0), 0) / activeChildren.length) : (Number(parent.status) || 0);
                        const isParentDelayed = checkDelay(parent);
                        const canEditParent = checkPermission(parent.assignee);
                        
                        return (
                            <details key={parent.id} className={`group bg-white border rounded-2xl overflow-hidden shadow-sm ${isParentDelayed ? 'border-impr-danger/50' : 'border-slate-200'}`} open>
                                <summary className="flex items-center justify-between p-4 sm:p-5 bg-slate-50/50 hover:bg-slate-100 transition-colors select-none cursor-pointer">
                                    <div className="flex items-center gap-3 sm:gap-4 overflow-hidden">
                                        <span className="flex-shrink-0 w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center bg-slate-800 text-white text-[10px] sm:text-xs font-mono font-bold rounded-lg shadow-sm">{parent.code}</span>
                                        <span className="font-black text-slate-700 text-sm tracking-tight truncate">{parent.name}</span>
                                        {isParentDelayed && <span className="text-[10px] font-bold text-white bg-impr-danger px-2 py-0.5 rounded-full flex items-center gap-1"><i data-lucide="alert-circle" className="w-3 h-3"></i> 延遲</span>}
                                        {!canEditParent && <span className="text-[10px] text-slate-400 border border-slate-200 px-1.5 rounded ml-2">唯讀</span>}
                                    </div>
                                    <div className="flex items-center gap-3 sm:gap-4 flex-shrink-0"><div className="flex items-center gap-2 px-2 py-1 sm:px-3 sm:py-1.5 bg-white rounded-lg border border-slate-200"><div className="w-10 sm:w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-impr-orange" style={{width: `${progress}%`}}></div></div><span className="text-xs font-black text-impr-orange">{progress}%</span></div><i data-lucide="chevron-down" className="w-4 h-4 sm:w-5 sm:h-5 text-slate-400 group-open:rotate-180 transition-transform"></i></div>
                                </summary>
                                <div className="p-3 sm:p-4 space-y-3 bg-white">
                                    <div className="p-4 rounded-xl border border-slate-100 bg-slate-50/20 mb-3">
                                        <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                                            <div className="md:col-span-2 relative flex items-center bg-white border border-slate-200 rounded-xl px-2">
                                                <i data-lucide="user" className="w-3.5 h-3.5 text-slate-400 mr-1 flex-shrink-0"></i>
                                                <select 
                                                    value={getAssigneeValue(members, parent.assignee)} 
                                                    disabled={!canEditParent} 
                                                    onClick={(e) => e.stopPropagation()}
                                                    onChange={(e) => {
                                                        e.stopPropagation();
                                                        onUpdate(parent.id, { assignee: e.target.value });
                                                    }} 
                                                    className="w-full bg-transparent py-2.5 text-xs font-bold text-slate-600 outline-none cursor-pointer appearance-none disabled:cursor-not-allowed"
                                                >
                                                    <option value="">未指派</option>
                                                    {members.map(m => {
                                                        const dName = String(m.name || m.username).trim();
                                                        if (!dName) return null;
                                                        return <option key={m.id} value={dName}>{dName}</option>;
                                                    })}
                                                </select>
                                                <i data-lucide="chevron-down" className="w-3 h-3 text-slate-400 flex-shrink-0 pointer-events-none"></i>
                                            </div>
                                            
                                            <div className="md:col-span-2"><input type="date" defaultValue={parent.dueDate} disabled={!canEditParent} onClick={(e) => e.stopPropagation()} onBlur={(e) => onUpdate(parent.id, { dueDate: e.target.value })} className={`editable-field w-full bg-white px-3 py-2.5 rounded-xl text-xs font-mono font-bold border border-slate-200 outline-none ${isParentDelayed ? 'text-impr-danger font-black' : 'text-slate-500'}`} /></div>
                                            <div className="md:col-span-3 flex items-center gap-3 bg-white px-3 py-2 rounded-xl border border-slate-200"><input type="range" min="0" max="100" step="10" defaultValue={parent.status} disabled={children.length > 0 || !canEditParent} onClick={(e) => e.stopPropagation()} onChange={(e) => { e.target.nextElementSibling.innerText = e.target.value + '%'; }} onMouseUp={(e) => onUpdate(parent.id, { status: Number(e.target.value) })} onTouchEnd={(e) => onUpdate(parent.id, { status: Number(e.target.value) })} className="flex-1 h-1.5 bg-slate-200 rounded-lg cursor-pointer accent-impr-orange" /><span className="text-xs font-black text-impr-orange w-8 text-right font-mono">{parent.status}%</span></div>
                                            <div className="md:col-span-5 relative"><i data-lucide="message-square" className="absolute left-3 top-3 w-3.5 h-3.5 text-slate-400"></i><input type="text" defaultValue={parent.note} disabled={!canEditParent} onClick={(e) => e.stopPropagation()} onBlur={(e) => onUpdate(parent.id, { note: e.target.value })} className="editable-field w-full bg-white pl-9 pr-3 py-2.5 rounded-xl text-xs text-slate-600 border border-slate-200 outline-none" placeholder="備註..." /></div>
                                        </div>
                                    </div>
                                    {children.map(child => {
                                        const isChildDelayed = checkDelay(child);
                                        const canEditChild = checkPermission(child.assignee);
                                        return (
                                        <div key={child.id} className={`p-4 rounded-xl border transition-all ${child.isApplicable ? `bg-white hover:border-slate-300 shadow-sm ${isChildDelayed ? 'border-impr-danger/30 bg-red-50/10' : 'border-slate-100'}` : 'bg-slate-50 border-transparent opacity-50'}`}>
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                                                <div className="flex items-center gap-3"><span className="text-slate-400 font-mono text-xs font-bold w-8 text-right">{child.code}</span><span className={`font-bold text-sm ${child.isApplicable ? 'text-slate-700' : 'line-through text-slate-400'}`}>{child.name}</span>{isChildDelayed && <span className="text-[9px] text-white bg-impr-danger px-1.5 py-0.5 rounded ml-2 flex items-center gap-0.5"><i data-lucide="alert-circle" className="w-2.5 h-2.5"></i> 延遲</span>}</div>
                                                <button disabled={!canEditChild} onClick={(e) => { e.stopPropagation(); onUpdate(child.id, { isApplicable: !child.isApplicable }); }} className={`self-start sm:self-auto px-2 py-1 rounded text-[10px] font-bold border transition-colors ${child.isApplicable ? 'text-slate-400 border-slate-200' : 'bg-slate-600 text-white border-slate-600'} ${!canEditChild ? 'opacity-50 cursor-not-allowed' : ''}`}>{child.isApplicable ? "設為不適用" : "恢復適用"}</button>
                                            </div>
                                            {child.isApplicable && (
                                                <div className="grid grid-cols-1 md:grid-cols-12 gap-3 pl-0 sm:pl-11">
                                                    
                                                    {/* --- 單一任務負責人下拉選單 --- */}
                                                    <div className="md:col-span-2 relative flex items-center bg-slate-50 border border-transparent hover:border-slate-200 transition-colors rounded-xl px-2">
                                                        <i data-lucide="user" className="w-3 h-3 text-slate-400 mr-1 flex-shrink-0"></i>
                                                        <select 
                                                            value={getAssigneeValue(members, child.assignee)} 
                                                            disabled={!canEditChild} 
                                                            onClick={(e) => e.stopPropagation()}
                                                            onChange={(e) => {
                                                                e.stopPropagation();
                                                                onUpdate(child.id, { assignee: e.target.value });
                                                            }} 
                                                            className="w-full bg-transparent py-2 text-xs font-bold text-slate-600 outline-none cursor-pointer appearance-none disabled:cursor-not-allowed"
                                                        >
                                                            <option value="">未指派</option>
                                                            {members.map(m => {
                                                                const dName = String(m.name || m.username).trim();
                                                                if (!dName) return null;
                                                                return <option key={m.id} value={dName}>{dName}</option>;
                                                            })}
                                                        </select>
                                                        <i data-lucide="chevron-down" className="w-3 h-3 text-slate-400 flex-shrink-0 pointer-events-none"></i>
                                                    </div>
                                                    
                                                    <div className="md:col-span-2"><input type="date" defaultValue={child.dueDate} disabled={!canEditChild} onClick={(e) => e.stopPropagation()} onBlur={(e) => onUpdate(child.id, { dueDate: e.target.value })} className={`editable-field w-full bg-slate-50 px-3 py-2 rounded-xl text-xs font-mono font-bold border border-transparent outline-none ${isChildDelayed ? 'text-impr-danger font-black' : 'text-slate-500'}`} /></div>
                                                    <div className="md:col-span-3 flex items-center gap-3 bg-slate-50 px-3 py-2 rounded-xl border border-transparent"><input type="range" min="0" max="100" step="10" defaultValue={child.status} disabled={!canEditChild} onClick={(e) => e.stopPropagation()} onChange={(e) => { e.target.nextElementSibling.innerText = e.target.value + '%'; }} onMouseUp={(e) => onUpdate(child.id, { status: Number(e.target.value) })} onTouchEnd={(e) => onUpdate(child.id, { status: Number(e.target.value) })} className="flex-1 h-1.5 bg-slate-200 rounded-lg cursor-pointer accent-impr-orange" /><span className={`text-xs font-black w-8 text-right font-mono ${isChildDelayed ? 'text-impr-danger' : 'text-impr-orange'}`}>{child.status}%</span></div>
                                                    <div className="md:col-span-5 relative"><i data-lucide="message-square" className="absolute left-3 top-3 w-3 h-3 text-slate-300"></i><input type="text" defaultValue={child.note} disabled={!canEditChild} onClick={(e) => e.stopPropagation()} onBlur={(e) => onUpdate(child.id, { note: e.target.value })} className="editable-field w-full bg-slate-50 pl-9 pr-3 py-2 rounded-xl text-xs text-slate-600 border border-transparent outline-none" placeholder="備註..." /></div>
                                                </div>
                                            )}
                                        </div>
                                    )})}
                                </div>
                            </details>
                        );
                    })}
                </div>
            );
        };

        // --- 獨立出的 DetailModal ---
        const DetailModal = ({ actId, tasks, user, members, onCreateTask, onUpdateTask, onClose }) => {
            const data = useMemo(() => {
                const actTasks = tasks.filter(t => t.activityId === actId);
                
                const calcProg = (type) => {
                    const subTasks = actTasks.filter(c => c.isApplicable && String(c.code).includes('.') && c.type === type);
                    if (subTasks.length === 0) return 0;
                    const sum = subTasks.reduce((s, t) => s + (Number(t.status) || 0), 0);
                    return Math.round(sum / subTasks.length);
                };

                return { 
                    surveyProgress: calcProg('SURVEY'),
                    itemProgress: calcProg('ITEM'),
                    allTasks: actTasks 
                };
            }, [actId, tasks]);

            const surveyTasks = data.allTasks.filter(t => t.type === 'SURVEY');
            const itemTasks = data.allTasks.filter(t => t.type === 'ITEM');

            const [isAdding, setIsAdding] = useState(false);
            const [newTask, setNewTask] = useState({ type: 'SURVEY', code: '', name: '' });

            const submitTask = () => {
                if(!newTask.code || !newTask.name) return alert('請輸入代碼與名稱');
                onCreateTask(actId, newTask);
                setIsAdding(false);
                setNewTask({ type: 'SURVEY', code: '', name: '' });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-md">
                    <div className="bg-white w-full h-full sm:h-[90vh] sm:max-w-5xl sm:rounded-[2rem] shadow-2xl flex flex-col overflow-hidden animate-in slide-in-from-bottom-10">
                        <div className="px-4 py-3 sm:px-8 py-5 border-b flex justify-between items-center bg-white z-10 shadow-sm">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-slate-100 rounded-xl hidden sm:block"><i data-lucide="layers" className="text-impr-orange w-5 h-5"></i></div>
                                <div>
                                    <h3 className="text-lg sm:text-xl font-black text-slate-800 italic tracking-tight">任務明細</h3>
                                    <p className="text-xs text-slate-400 font-bold flex gap-3 mt-1">
                                        <span>場勘進度：<span className="text-impr-orange font-black text-sm">{data.surveyProgress}%</span></span>
                                        <span>籌備進度：<span className="text-blue-500 font-black text-sm">{data.itemProgress}%</span></span>
                                    </p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsAdding(!isAdding)} className="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold hover:bg-slate-700 flex items-center gap-1 transition-colors"><i data-lucide="plus" className="w-3 h-3"></i> 新增任務</button>
                                <button onClick={onClose} className="w-9 h-9 flex items-center justify-center bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 transition-colors"><i data-lucide="x" className="w-5 h-5"></i></button>
                            </div>
                        </div>
                        {isAdding && (
                            <div className="p-4 bg-slate-50 border-b border-slate-200 grid grid-cols-1 sm:grid-cols-12 gap-3 items-end animate-in slide-in-from-top-2">
                                <div className="sm:col-span-3"><label className="text-[10px] font-bold text-slate-400 mb-1 block">類型</label><select className="w-full p-2 text-xs rounded-lg border font-bold outline-none" value={newTask.type} onChange={e => setNewTask({...newTask, type: e.target.value})}><option value="SURVEY">場勘查核 (Survey)</option><option value="ITEM">專案籌備 (Item)</option></select></div>
                                <div className="sm:col-span-2"><label className="text-[10px] font-bold text-slate-400 mb-1 block">代碼</label><input type="text" className="w-full p-2 text-xs rounded-lg border font-bold outline-none" placeholder="如 3.1" value={newTask.code} onChange={e => setNewTask({...newTask, code: e.target.value})} /></div>
                                <div className="sm:col-span-5"><label className="text-[10px] font-bold text-slate-400 mb-1 block">任務名稱</label><input type="text" className="w-full p-2 text-xs rounded-lg border font-bold outline-none" placeholder="輸入任務名稱..." value={newTask.name} onChange={e => setNewTask({...newTask, name: e.target.value})} /></div>
                                <div className="sm:col-span-2 flex gap-2"><button onClick={submitTask} className="flex-1 py-2 bg-impr-orange text-white text-xs font-bold rounded-lg hover:bg-orange-600">確認</button><button onClick={() => setIsAdding(false)} className="px-3 py-2 bg-white border text-xs font-bold rounded-lg text-slate-500 hover:bg-slate-50">取消</button></div>
                            </div>
                        )}
                        <div className="flex-1 overflow-y-auto p-4 sm:p-8 bg-slate-50/50 no-scrollbar space-y-8 pb-20">
                            <div><h4 className="text-xs font-black text-slate-500 uppercase tracking-[0.2em] mb-4 pl-2 border-l-4 border-impr-orange">場勘查核 (Survey)</h4><TaskHierarchy tasks={surveyTasks} user={user} members={members} onUpdate={onUpdateTask} /></div>
                            <div><h4 className="text-xs font-black text-slate-500 uppercase tracking-[0.2em] mb-4 pl-2 border-l-4 border-blue-500">專案籌備 (Item)</h4><TaskHierarchy tasks={itemTasks} user={user} members={members} onUpdate={onUpdateTask} /></div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            
            const [members, setMembers] = useState(() => {
                try {
                    const cached = localStorage.getItem('impr_team_v8.4');
                    const parsed = cached ? JSON.parse(cached) : null;
                    return parsed && parsed.length > 0 ? parsed : [];
                } catch { return []; }
            });

            const [activities, setActivities] = useState(() => {
                try {
                    const cached = localStorage.getItem('impr_activities_v8.4');
                    return cached ? JSON.parse(cached) : [];
                } catch { return []; }
            });

            const [tasks, setTasks] = useState(() => {
                try {
                    const cached = localStorage.getItem('impr_tasks_v8.4');
                    return cached ? JSON.parse(cached) : [];
                } catch { return []; }
            });

            const [loading, setLoading] = useState(false);
            const [selAct, setSelAct] = useState(null);
            const [isCreateOpen, setIsCreateOpen] = useState(false);
            const [error, setError] = useState('');
            const [form, setForm] = useState({ name: '', clientName: '', startDate: '', endDate: '', location: '', manager: '' });
            const [activePage, setActivePage] = useState('dashboard'); 
            const [viewTab, setViewTab] = useState('active'); 
            const [sidebarOpen, setSidebarOpen] = useState(false); 
            const [sidebarImgError, setSidebarImgError] = useState(false);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            useEffect(() => {
                if (activities && activities.length > 0) {
                    localStorage.setItem('impr_activities_v8.4', JSON.stringify(activities));
                    localStorage.setItem('impr_tasks_v8.4', JSON.stringify(tasks));
                }
                if (members && members.length > 0) {
                    localStorage.setItem('impr_team_v8.4', JSON.stringify(members));
                }
            }, [activities, tasks, members]);

            const fetchData = async (currUser = user) => {
                setLoading(true);
                
                if (GAS_API_URL) {
                    const res = await callGAS({ action: 'getData', role: currUser?.role, name: currUser?.name });
                    if (res.status === 'success') {
                        if (res.members !== undefined) {
                            setMembers(res.members); // 無條件覆寫，資料庫裡有誰就顯示誰
                        }
                        setActivities(res.activities || []);
                        setTasks(res.tasks || []);
                    } else {
                        setError(res.message || '資料讀取失敗');
                    }
                    setLoading(false);
                } else {
                    if (activities.length === 0 || tasks.length === 0) {
                        setTimeout(() => {
                            if (members.length === 0) setMembers(DEFAULT_MEMBERS);
                            const defaultActs = [
                                { id: 'ACT-1771325908466', name: '2026 test', clientName: 'test', location: '', status: '進行中', startDate: '2026-03-17', endDate: '2026-04-01', assignee: 'Joseph' },
                                { id: 'ACT-1771370518075', name: 'test', clientName: 'aaa', location: '', status: '進行中', startDate: '2026-02-04', endDate: '2026-03-20', assignee: 'Joseph' },
                                { id: 'ACT-1771370620830', name: 'dad', clientName: '11112', location: '', status: '進行中', startDate: '2026-02-04', endDate: '2026-03-12', assignee: 'Joseph' },
                                { id: 'ACT-1771371867101', name: '1213', clientName: '5688', location: '', status: '進行中', startDate: '2026-02-18', endDate: '2026-03-13', assignee: 'Joseph' }
                            ];
                            setActivities(defaultActs);
                            
                            let allTasks = [];
                            defaultActs.forEach(act => {
                                SURVEY_TEMPLATE.forEach((t, i) => allTasks.push({ id: `${act.id}_s_${i}`, activityId: act.id, ...t, type: 'SURVEY', status: 0, isApplicable: true, assignee: 'Joseph', dueDate: act.endDate, note: '' }));
                                ITEM_TEMPLATE.forEach((t, i) => allTasks.push({ id: `${act.id}_i_${i}`, activityId: act.id, ...t, type: 'ITEM', status: 0, isApplicable: true, assignee: 'Joseph', dueDate: act.endDate, note: '' }));
                            });
                            setTasks(allTasks);
                            setLoading(false);
                        }, 800);
                    } else {
                        setLoading(false);
                    }
                }
            };

            const handleLogin = async (u, p) => {
                if(!u || !p) return setError('請輸入帳號與密碼');
                setLoading(true);
                
                if (GAS_API_URL) {
                    const res = await callGAS({ action: 'login', username: u, password: p });
                    if (res.status === 'success') {
                        setUser(res.user);
                        fetchData(res.user);
                    } else {
                        setError(res.message || '帳號或密碼錯誤');
                        setLoading(false);
                    }
                } else {
                    setTimeout(() => {
                        const activeMembers = members.length > 0 ? members : DEFAULT_MEMBERS;
                        const foundUser = activeMembers.find(m => 
                            (m.username.toLowerCase() === u.toLowerCase() || m.name.toLowerCase() === u.toLowerCase()) && 
                            (m.password === p)
                        );
                        
                        if (foundUser) {
                            setUser({ name: foundUser.name, role: foundUser.role });
                            fetchData({ name: foundUser.name, role: foundUser.role });
                        } else {
                            setError('帳號或密碼錯誤');
                            setLoading(false);
                        }
                    }, 500);
                }
            };

            const handleUpdateTask = async (tId, updates) => {
                setTasks(prev => prev.map(t => t.id === tId ? { ...t, ...updates } : t));
                await callGAS({ action: 'updateTask', taskId: tId, ...updates });
            };

            const handleUpdateActivity = async (actId, updates) => {
                setActivities(prev => prev.map(a => a.id === actId ? { ...a, ...updates } : a));
                await callGAS({ action: 'updateActivity', activityId: actId, ...updates });
            };

            const handleCreate = async () => {
                if(!form.name) return;
                setLoading(true);
                
                const assigneeName = form.manager || user.name;
                const newActId = 'ACT-' + Date.now();
                const newAct = { id: newActId, name: form.name, clientName: form.clientName || '新客戶', location: form.location, status: '籌備中', startDate: form.startDate, endDate: form.endDate, assignee: assigneeName };
                
                let newTasks = [];
                SURVEY_TEMPLATE.forEach((t, i) => newTasks.push({ id: `${newActId}_s_${i}`, activityId: newActId, ...t, type: 'SURVEY', status: 0, isApplicable: true, assignee: assigneeName, dueDate: form.endDate, note: '' }));
                ITEM_TEMPLATE.forEach((t, i) => newTasks.push({ id: `${newActId}_i_${i}`, activityId: newActId, ...t, type: 'ITEM', status: 0, isApplicable: true, assignee: assigneeName, dueDate: form.endDate, note: '' }));

                await callGAS({ action: 'createActivity', ...form, manager: assigneeName });

                setTimeout(() => { 
                    setActivities(prev => [newAct, ...prev]);
                    setTasks(prev => [...prev, ...newTasks]);
                    setIsCreateOpen(false); 
                    setForm({name:'',clientName:'',startDate:'',endDate:'', location:'', manager: ''}); 
                    setLoading(false);
                }, 800);
            };

            const handleCreateTask = async (actId, taskData) => {
                const newId = 't' + Date.now();
                const newTask = { id: newId, activityId: actId, code: taskData.code, name: taskData.name, type: taskData.type, status: 0, isApplicable: true, assignee: user.name, note: '', dueDate: '' };
                setTasks(prev => [...prev, newTask]);
                await callGAS({ action: 'createTask', ...newTask });
            };

            const handleDelete = async (actId) => {
                if(!confirm('確定刪除此專案？')) return;
                setLoading(true);
                await callGAS({ action: 'deleteActivity', activityId: actId });
                setActivities(prev => prev.filter(a => a.id !== actId));
                setLoading(false);
            };

            const getDelayedCount = (actId) => {
                const today = new Date();
                today.setHours(0,0,0,0);
                return tasks.filter(t => 
                    t.activityId === actId && 
                    t.isApplicable && 
                    t.status < 100 && 
                    t.dueDate && 
                    new Date(t.dueDate) < today
                ).length;
            };
            
            const getProgress = (actId, type) => {
                const actTasks = tasks.filter(t => t.activityId === actId && t.type === type);
                const subTasks = actTasks.filter(c => c.isApplicable && String(c.code).includes('.'));
                if (subTasks.length > 0) {
                    const sum = subTasks.reduce((s, t) => s + (Number(t.status) || 0), 0);
                    return Math.round(sum / subTasks.length);
                }
                return 0;
            };

            const filteredActivities = useMemo(() => {
                return activities.filter(act => {
                    const isHistory = ['已完工', '結案'].includes(act.status);
                    return viewTab === 'history' ? isHistory : !isHistory;
                });
            }, [activities, viewTab]);

            if (!user) return <LoginPage onLogin={handleLogin} loading={loading} error={error} />;

            return (
                <div className="flex h-screen bg-white overflow-hidden">
                    {sidebarOpen && <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setSidebarOpen(false)}></div>}
                    <div className={`sidebar-fixed bg-impr-dark flex flex-col text-white shadow-2xl p-6 ${sidebarOpen ? 'sidebar-open' : ''}`}>
                        <div className="flex flex-col items-center mb-8 pt-4">
                            {!sidebarImgError ? <img src={logoUrl} className="h-12 mb-2 object-contain" onError={() => setSidebarImgError(true)} alt="Sidebar Logo" /> : <div className="p-2 bg-white/10 rounded-xl border border-white/20 mb-2">{IMPR_LOGO_SVG("w-8 h-8")}</div>}
                            <div className="text-center"><span className="font-black text-xl text-white mt-2 italic tracking-tighter">IMPR HUB</span></div>
                        </div>
                        <nav className="flex-1 space-y-2">
                            {['dashboard', 'calendar', 'team', 'reports'].map(page => (
                                <button key={page} onClick={() => { setActivePage(page); setSidebarOpen(false); }} className={`w-full p-3.5 rounded-2xl font-black text-sm flex items-center gap-3 cursor-pointer transition-all text-left ${activePage === page ? 'bg-impr-orange text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide={page === 'dashboard' ? 'layout-dashboard' : page === 'calendar' ? 'calendar-days' : page === 'team' ? 'users' : 'file-bar-chart-2'} className="w-5 h-5"></i> 
                                    {page === 'dashboard' ? '專案管考看板' : page === 'calendar' ? '專案行事曆' : page === 'team' ? '團隊成員管理' : '數據分析報表'}
                                </button>
                            ))}
                        </nav>
                        <div className="mt-auto border-t border-slate-800 pt-6">
                            <button onClick={()=>setUser(null)} className="w-full py-3.5 border border-slate-700 rounded-2xl text-[10px] font-black text-slate-400 hover:text-white transition-all flex items-center justify-center gap-2"><i data-lucide="log-out" className="w-3.5 h-3.5 text-rose-500"></i> 登出</button>
                        </div>
                    </div>

                    <div className="content-area flex flex-col h-full bg-slate-50 overflow-hidden">
                        <header className="px-5 py-4 sm:px-10 sm:py-8 bg-white border-b flex justify-between items-center sticky top-0 z-30 shadow-sm">
                            <div className="flex items-center gap-3"><button onClick={() => setSidebarOpen(true)} className="md:hidden text-slate-500"><i data-lucide="menu" className="w-6 h-6"></i></button><h1 className="text-lg sm:text-2xl font-black text-slate-800 tracking-tighter italic">{activePage === 'dashboard' ? '管考看板' : activePage === 'team' ? '團隊管理' : activePage === 'calendar' ? '專案行事曆' : '數據報表'}</h1></div>
                            {activePage === 'dashboard' && <button onClick={()=>setIsCreateOpen(true)} className="px-4 py-2 sm:px-6 sm:py-3 bg-impr-orange text-white rounded-xl sm:rounded-2xl font-black text-xs sm:text-sm shadow-xl active:scale-95 transition-all flex items-center gap-2"><i data-lucide="plus" className="w-4 h-4"></i> <span className="hidden sm:inline">新增專案</span><span className="sm:hidden">新增</span></button>}
                        </header>
                        <main className="flex-1 overflow-auto p-4 sm:p-10 no-scrollbar">
                            {activePage === 'dashboard' ? (
                                <>
                                    <DashboardStats activities={activities} />
                                    <div className="flex items-center gap-2 sm:gap-4 mb-6 overflow-x-auto pb-2">
                                        <button onClick={()=>setViewTab('active')} className={`flex-shrink-0 px-4 py-2 sm:px-6 sm:py-2.5 rounded-xl text-xs sm:text-sm font-black transition-all ${viewTab==='active' ? 'bg-slate-800 text-white shadow-lg' : 'bg-white text-slate-400'}`}>🚀 執行中</button>
                                        <button onClick={()=>setViewTab('history')} className={`flex-shrink-0 px-4 py-2 sm:px-6 sm:py-2.5 rounded-xl text-xs sm:text-sm font-black transition-all ${viewTab==='history' ? 'bg-slate-800 text-white shadow-lg' : 'bg-white text-slate-400'}`}>📦 歷史歸檔</button>
                                    </div>
                                    <div className="grid grid-cols-1 gap-4 sm:gap-6">
                                        {filteredActivities.length === 0 ? <div className="text-center py-20 text-slate-400 bg-white rounded-3xl border border-dashed border-slate-200"><i data-lucide="inbox" className="w-10 h-10 mx-auto mb-2 opacity-20"></i>{viewTab === 'active' ? '暫無專案' : '尚無歸檔資料'}</div> : filteredActivities.map(act => {
                                            const delayedCount = getDelayedCount(act.id);
                                            return (
                                            <div key={act.id} className="bg-white rounded-2xl sm:rounded-[2.5rem] border border-slate-200 shadow-sm p-5 sm:p-8 flex flex-col md:flex-row gap-6 hover:border-impr-orange/30 transition-all relative">
                                                {delayedCount > 0 && <div className="absolute top-4 right-4 bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs font-bold border border-red-100 flex items-center gap-1 shadow-sm"><i data-lucide="alert-triangle" className="w-3.5 h-3.5"></i> {delayedCount} 項延遲</div>}
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <select value={act.status} onChange={(e) => handleUpdateActivity(act.id, { status: e.target.value })} className={`px-2 py-1 rounded-lg text-[10px] font-black border uppercase tracking-widest outline-none cursor-pointer ${['已完工','結案'].includes(act.status) ? 'bg-slate-100 text-slate-500' : 'bg-blue-50 text-blue-600 border-blue-100'}`} disabled={user?.role !== 'admin'}><option value="籌備中">籌備中</option><option value="進行中">進行中</option><option value="已完工">已完工</option><option value="結案">結案</option></select>
                                                        
                                                        <div className="flex items-center gap-1 bg-slate-50 hover:bg-slate-100 border border-slate-200 px-2 py-1 rounded-lg transition-colors cursor-pointer relative">
                                                            <i data-lucide="user" className="w-3 h-3 text-slate-400 flex-shrink-0"></i>
                                                            <select 
                                                                onClick={(e) => e.stopPropagation()}
                                                                value={getAssigneeValue(members, act.assignee)} 
                                                                onChange={(e) => {
                                                                    e.stopPropagation();
                                                                    handleUpdateActivity(act.id, { assignee: e.target.value });
                                                                }}
                                                                className="bg-transparent text-[10px] font-bold text-slate-600 outline-none cursor-pointer appearance-none pr-4 w-full disabled:cursor-not-allowed"
                                                                disabled={user?.role !== 'admin'}
                                                            >
                                                                <option value="">未指派負責人</option>
                                                                {members.map(m => {
                                                                    const dName = String(m.name || m.username).trim();
                                                                    if(!dName) return null;
                                                                    return <option key={m.id} value={dName}>{dName}</option>;
                                                                })}
                                                            </select>
                                                            <i data-lucide="chevron-down" className="w-2.5 h-2.5 text-slate-400 absolute right-2 pointer-events-none"></i>
                                                        </div>

                                                    </div>
                                                    <h2 className="text-lg sm:text-xl font-black text-slate-800 mb-2 tracking-tight">{act.name}</h2>
                                                    <div className="flex flex-wrap items-center gap-3 text-xs font-bold text-slate-400"><span className="flex items-center gap-1"><i data-lucide="briefcase" className="w-3 h-3"></i> {act.clientName}</span><span className="flex items-center gap-1"><i data-lucide="map-pin" className="w-3 h-3"></i> {act.location || '未填寫'}</span></div>
                                                </div>
                                                
                                                <div className="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-8 pt-4 sm:pt-0 border-t sm:border-0 border-slate-50">
                                                    <div className="flex flex-col items-end gap-2 w-full sm:w-auto">
                                                        <div className="flex items-center gap-3 w-full sm:w-auto">
                                                            <span className="text-[10px] font-bold text-slate-400 w-8 text-right">場勘</span>
                                                            <div className="flex-1 sm:flex-none w-auto sm:w-20 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                                <div className="h-full bg-impr-orange" style={{width: `${getProgress(act.id, 'SURVEY')}%`}}></div>
                                                            </div>
                                                            <span className="text-xs font-black text-slate-500 font-mono w-8 text-right">{getProgress(act.id, 'SURVEY')}%</span>
                                                        </div>
                                                        <div className="flex items-center gap-3 w-full sm:w-auto">
                                                            <span className="text-[10px] font-bold text-slate-400 w-8 text-right">籌備</span>
                                                            <div className="flex-1 sm:flex-none w-auto sm:w-20 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                                <div className="h-full bg-blue-500" style={{width: `${getProgress(act.id, 'ITEM')}%`}}></div>
                                                            </div>
                                                            <span className="text-xs font-black text-slate-500 font-mono w-8 text-right">{getProgress(act.id, 'ITEM')}%</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={()=>setSelAct(act.id)} className="flex-1 sm:flex-none px-6 py-3 bg-slate-900 text-white rounded-xl text-xs font-black shadow-lg">管考明細</button>
                                                        <button onClick={()=>handleDelete(act.id)} className="w-10 h-10 flex items-center justify-center border border-slate-200 text-slate-400 rounded-xl hover:text-red-500 hover:bg-red-50"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                    </div>
                                                </div>

                                            </div>
                                        )})}
                                    </div>
                                </>
                            ) : activePage === 'team' ? <TeamManager members={members} setMembers={setMembers} /> : activePage === 'calendar' ? <ProjectCalendar activities={activities} /> : <ReportsManager activities={activities} tasks={tasks} teamMembers={members} />}
                        </main>
                    </div>

                    {isCreateOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={(e) => { if(e.target === e.currentTarget) setIsCreateOpen(false); }}>
                            <div className="bg-white w-full max-w-md p-6 sm:p-8 rounded-3xl shadow-2xl animate-in zoom-in-95">
                                <h3 className="font-bold text-lg mb-4">新增專案</h3>
                                <div className="space-y-3">
                                    <input type="text" placeholder="專案名稱" className="w-full p-3 border rounded-xl font-bold text-sm" onChange={e=>setForm({...form, name: e.target.value})}/>
                                    <input type="text" placeholder="客戶名稱" className="w-full p-3 border rounded-xl font-bold text-sm" onChange={e=>setForm({...form, clientName: e.target.value})}/>
                                    
                                    <div className="relative">
                                        <select 
                                            className="w-full p-3 border rounded-xl font-bold text-sm text-slate-600 outline-none cursor-pointer appearance-none"
                                            onChange={e => setForm({...form, manager: e.target.value})}
                                            value={form.manager || user?.name || ''}
                                        >
                                            <option value="">請選擇專案負責人</option>
                                            {members.map(m => {
                                                const dName = String(m.name || m.username).trim();
                                                if (!dName) return null;
                                                return <option key={m.id} value={dName}>{dName}</option>;
                                            })}
                                        </select>
                                        <i data-lucide="chevron-down" className="w-4 h-4 text-slate-400 absolute right-4 top-4 pointer-events-none"></i>
                                    </div>
                                    
                                    <input type="text" placeholder="活動地點" className="w-full p-3 border rounded-xl font-bold text-sm" onChange={e=>setForm({...form, location: e.target.value})}/>
                                    <div className="flex gap-3"><input type="date" className="w-1/2 p-3 border rounded-xl text-sm" onChange={e=>setForm({...form, startDate: e.target.value})}/><input type="date" className="w-1/2 p-3 border rounded-xl text-sm" onChange={e=>setForm({...form, endDate: e.target.value})}/></div>
                                </div>
                                <div className="flex gap-3 mt-6"><button onClick={()=>setIsCreateOpen(false)} className="flex-1 py-3 bg-slate-100 font-bold rounded-xl text-slate-500">取消</button><button onClick={handleCreate} disabled={loading} className="flex-1 py-3 bg-impr-orange text-white font-bold rounded-xl shadow-lg">{loading?"建立中...":"建立"}</button></div>
                            </div>
                        </div>
                    )}
                    
                    {selAct && (
                        <DetailModal 
                            actId={selAct} 
                            tasks={tasks}
                            user={user}
                            members={members}
                            onCreateTask={handleCreateTask} 
                            onUpdateTask={handleUpdateTask}
                            onClose={() => setSelAct(null)}
                        />
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
