                const cached = localStorage.getItem('impr_team_v5'); // 使用 v5 確保清除舊資料
                if (cached) setMembers(JSON.parse(cached));
            }, []);

            useEffect(() => {
                localStorage.setItem('impr_team_v5', JSON.stringify(members));
            }, [members]);

            const handleSubmit = () => {
                if(!formData.name) return alert('請輸入姓名');
                if (editId) {
                    setMembers(prev => prev.map(m => m.id === editId ? { ...m, ...formData } : m));
                } else {
                    const newMember = { id: Date.now(), ...formData };
                    setMembers(prev => [...prev, newMember]);
                }
                resetForm();
            };

            const handleEdit = (member) => {
                setFormData({ name: member.name, role: member.role, email: member.email, phone: member.phone });
                setEditId(member.id);
                setIsEditing(true);
            };

            const handleDelete = (id) => {
                if(confirm('確定刪除此成員？')) {
                    setMembers(prev => prev.filter(m => m.id !== id));
                }
            };

            const resetForm = () => {
                setFormData({ name: '', role: '', email: '', phone: '' });
                setEditId(null);
                setIsEditing(false);
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xl font-black text-slate-800">團隊成員管理</h2>
                        <button onClick={() => setIsEditing(true)} className="px-4 py-2 bg-impr-orange text-white rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-orange-600 transition-colors"><i data-lucide="user-plus" className="w-4 h-4"></i> 新增成員</button>
                    </div>
                    {isEditing && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 animate-in slide-in-from-top-2">
                            <h3 className="font-bold text-slate-700 mb-4">{editId ? '編輯成員資料' : '新增團隊成員'}</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                                <input type="text" placeholder="姓名" className="p-3 border rounded-xl text-sm outline-none focus:border-impr-orange" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} />
                                <input type="text" placeholder="職稱 (admin/staff)" className="p-3 border rounded-xl text-sm outline-none focus:border-impr-orange" value={formData.role} onChange={e=>setFormData({...formData, role: e.target.value})} />
                                <input type="email" placeholder="Email" className="p-3 border rounded-xl text-sm outline-none focus:border-impr-orange" value={formData.email} onChange={e=>setFormData({...formData, email: e.target.value})} />
                                <input type="text" placeholder="電話" className="p-3 border rounded-xl text-sm outline-none focus:border-impr-orange" value={formData.phone} onChange={e=>setFormData({...formData, phone: e.target.value})} />
                            </div>
                            <div className="flex gap-3">
                                <button onClick={handleSubmit} className="px-6 py-2 bg-slate-800 text-white rounded-xl text-sm font-bold hover:bg-slate-700">確認{editId ? '變更' : '新增'}</button>
                                <button onClick={resetForm} className="px-6 py-2 bg-slate-100 text-slate-500 rounded-xl text-sm font-bold hover:bg-slate-200">取消</button>
                            </div>
                        </div>
                    )}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {members.map(m => (
                            <div key={m.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between group hover:border-impr-orange/30 transition-all">
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-500">{m.name[0].toUpperCase()}</div>
                                    <div><p className="font-bold text-slate-800">{m.name}</p><p className="text-xs text-slate-400">{m.role}</p></div>
                                </div>
                                <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onClick={() => handleEdit(m)} className="p-2 text-slate-400 hover:text-blue-500 hover:bg-blue-50 rounded-lg transition-colors"><i data-lucide="edit-2" className="w-4 h-4"></i></button>
                                    <button onClick={() => handleDelete(m.id)} className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const TaskHierarchy = ({ tasks, onUpdate }) => {
            const { parents, childrenMap } = useMemo(() => {
                const parents = [];
                const childrenMap = {};
                const allCodes = new Set(tasks.map(t => String(t.code)));
                const sortedTasks = [...tasks].sort((a, b) => {
                    const pa = String(a.code).split('.').map(Number);
                    const pb = String(b.code).split('.').map(Number);
                    for (let i = 0; i < Math.max(pa.length, pb.length); i++) { if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0); }
                    return 0;
                });
                sortedTasks.forEach(t => {
                    const codeStr = String(t.code);
                    const isChild = codeStr.includes('.');
                    const pCode = isChild ? codeStr.split('.')[0] : null;
                    if (isChild && allCodes.has(pCode)) {
                        if (!childrenMap[pCode]) childrenMap[pCode] = [];
                        childrenMap[pCode].push(t);
                    } else { parents.push(t); }
                });
                return { parents, childrenMap };
            }, [tasks]);

            if (parents.length === 0) return <div className="p-8 text-center text-slate-300 italic text-sm">暫無任務</div>;

            return (
                <div className="space-y-4">
                    {parents.map(parent => {
                        const children = childrenMap[parent.code] || [];
                        const activeChildren = children.filter(c => c.isApplicable);
                        const progress = activeChildren.length > 0 ? Math.round(activeChildren.reduce((acc, curr) => acc + (Number(curr.status)||0), 0) / activeChildren.length) : (Number(parent.status) || 0);
                        return (
                            <details key={parent.id} className="group bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm" open>
                                <summary className="flex items-center justify-between p-4 sm:p-5 bg-slate-50/50 hover:bg-slate-100 transition-colors select-none cursor-pointer">
                                    <div className="flex items-center gap-3 sm:gap-4 overflow-hidden"><span className="flex-shrink-0 w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center bg-slate-800 text-white text-[10px] sm:text-xs font-mono font-bold rounded-lg shadow-sm">{parent.code}</span><span className="font-black text-slate-700 text-sm tracking-tight truncate">{parent.name}</span></div>
                                    <div className="flex items-center gap-3 sm:gap-4 flex-shrink-0"><div className="flex items-center gap-2 px-2 py-1 sm:px-3 sm:py-1.5 bg-white rounded-lg border border-slate-200"><div className="w-10 sm:w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-impr-orange" style={{width: `${progress}%`}}></div></div><span className="text-xs font-black text-impr-orange">{progress}%</span></div><i data-lucide="chevron-down" className="w-4 h-4 sm:w-5 sm:h-5 text-slate-400 group-open:rotate-180 transition-transform"></i></div>
                                </summary>
                                <div className="p-3 sm:p-4 space-y-3 bg-white">
                                    <div className="p-4 rounded-xl border border-slate-100 bg-slate-50/20 mb-3">
                                        <div className="grid grid-cols-1 md:grid-cols-12 gap-3">
                                            <div className="md:col-span-2 relative"><i data-lucide="user" className="absolute left-3 top-3 w-3.5 h-3.5 text-slate-400"></i><input type="text" defaultValue={parent.assignee} onBlur={(e) => onUpdate(parent.id, { assignee: e.target.value })} className="editable-field w-full bg-white pl-9 pr-2 py-2.5 rounded-xl text-xs font-bold text-slate-600 border border-slate-200 outline-none" placeholder="總負責人" /></div>
                                            <div className="md:col-span-2"><input type="date" defaultValue={parent.dueDate} onBlur={(e) => onUpdate(parent.id, { dueDate: e.target.value })} className="editable-field w-full bg-white px-3 py-2.5 rounded-xl text-xs font-mono font-bold text-slate-500 border border-slate-200 outline-none" /></div>
                                            <div className="md:col-span-3 flex items-center gap-3 bg-white px-3 py-2 rounded-xl border border-slate-200"><input type="range" min="0" max="100" step="10" defaultValue={parent.status} onChange={(e) => { e.target.nextElementSibling.innerText = e.target.value + '%'; }} onMouseUp={(e) => onUpdate(parent.id, { status: Number(e.target.value) })} onTouchEnd={(e) => onUpdate(parent.id, { status: Number(e.target.value) })} className="flex-1 h-1.5 bg-slate-200 rounded-lg cursor-pointer accent-impr-orange" disabled={children.length > 0} /><span className="text-xs font-black text-impr-orange w-8 text-right font-mono">{parent.status}%</span></div>
                                            <div className="md:col-span-5 relative"><i data-lucide="message-square" className="absolute left-3 top-3 w-3.5 h-3.5 text-slate-400"></i><input type="text" defaultValue={parent.note} onBlur={(e) => onUpdate(parent.id, { note: e.target.value })} className="editable-field w-full bg-white pl-9 pr-3 py-2.5 rounded-xl text-xs text-slate-600 border border-slate-200 outline-none" placeholder="備註..." /></div>
                                        </div>
                                    </div>
                                    {children.map(child => (
                                        <div key={child.id} className={`p-4 rounded-xl border transition-all ${child.isApplicable ? 'bg-white border-slate-100 hover:border-slate-300 shadow-sm' : 'bg-slate-50 border-transparent opacity-50'}`}>
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                                                <div className="flex items-center gap-3"><span className="text-slate-400 font-mono text-xs font-bold w-8 text-right">{child.code}</span><span className={`font-bold text-sm ${child.isApplicable ? 'text-slate-700' : 'line-through text-slate-400'}`}>{child.name}</span></div>
                                                <button onClick={() => onUpdate(child.id, { isApplicable: !child.isApplicable })} className={`self-start sm:self-auto px-2 py-1 rounded text-[10px] font-bold border transition-colors ${child.isApplicable ? 'text-slate-400 border-slate-200' : 'bg-slate-600 text-white border-slate-600'}`}>{child.isApplicable ? "設為不適用" : "恢復適用"}</button>
                                            </div>
                                            {child.isApplicable && (
                                                <div className="grid grid-cols-1 md:grid-cols-12 gap-3 pl-0 sm:pl-11">
                                                    <div className="md:col-span-2 relative"><i data-lucide="user" className="absolute left-3 top-3 w-3 h-3 text-slate-400"></i><input type="text" defaultValue={child.assignee} onBlur={(e) => onUpdate(child.id, { assignee: e.target.value })} className="editable-field w-full bg-slate-50 pl-8 pr-2 py-2 rounded-xl text-xs font-bold text-slate-600 border border-transparent outline-none" placeholder="負責人" /></div>
                                                    <div className="md:col-span-2"><input type="date" defaultValue={child.dueDate} onBlur={(e) => onUpdate(child.id, { dueDate: e.target.value })} className="editable-field w-full bg-slate-50 px-3 py-2 rounded-xl text-xs font-mono font-bold text-slate-500 border border-transparent outline-none" /></div>
                                                    <div className="md:col-span-3 flex items-center gap-3 bg-slate-50 px-3 py-2 rounded-xl border border-transparent"><input type="range" min="0" max="100" step="10" defaultValue={child.status} onChange={(e) => { e.target.nextElementSibling.innerText = e.target.value + '%'; }} onMouseUp={(e) => onUpdate(child.id, { status: Number(e.target.value) })} onTouchEnd={(e) => onUpdate(child.id, { status: Number(e.target.value) })} className="flex-1 h-1.5 bg-slate-200 rounded-lg cursor-pointer accent-impr-orange" /><span className="text-xs font-black text-impr-orange w-8 text-right font-mono">{child.status}%</span></div>
                                                    <div className="md:col-span-5 relative"><i data-lucide="message-square" className="absolute left-3 top-3 w-3 h-3 text-slate-300"></i><input type="text" defaultValue={child.note} onBlur={(e) => onUpdate(child.id, { note: e.target.value })} className="editable-field w-full bg-slate-50 pl-9 pr-3 py-2 rounded-xl text-xs text-slate-600 border border-transparent outline-none" placeholder="備註..." /></div>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </details>
                        );
                    })}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [activities, setActivities] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(false);
            const [selAct, setSelAct] = useState(null);
            const [isCreateOpen, setIsCreateOpen] = useState(false);
            const [error, setError] = useState('');
            const [form, setForm] = useState({ name: '', clientName: '', startDate: '', endDate: '', location: '' });
            const [activePage, setActivePage] = useState('dashboard'); 
            const [viewTab, setViewTab] = useState('active'); 
            const [sidebarOpen, setSidebarOpen] = useState(false); 
            const [sidebarImgError, setSidebarImgError] = useState(false);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            // 讀取/儲存 LocalStorage (Use v5 key to separate from previous sessions)
            useEffect(() => {
                if (user && activities.length > 0) {
                    localStorage.setItem('impr_activities_v5', JSON.stringify(activities));
                    localStorage.setItem('impr_tasks_v5', JSON.stringify(tasks));
                }
            }, [activities, tasks, user]);

            const fetchData = async (currUser) => {
                setLoading(true);
                const cachedActs = localStorage.getItem('impr_activities_v5');
                const cachedTasks = localStorage.getItem('impr_tasks_v5');

                if (cachedActs && cachedTasks) {
                    setActivities(JSON.parse(cachedActs));
                    setTasks(JSON.parse(cachedTasks));
                    setLoading(false);
                } else {
                    setTimeout(() => {
                        // 依據 ACTIVITY.csv 資料
                        const defaultActs = [
                            { id: 'ACT-1771325908466', name: '2026 test', clientName: 'test', location: '台北', status: '進行中' },
                            { id: 'ACT-1771370518075', name: 'test', clientName: 'aaa', location: '高雄', status: '進行中' },
                            { id: 'ACT-1771370620830', name: 'dad', clientName: '11112', location: '台中', status: '進行中' },
                            { id: 'ACT-1771371867101', name: '1213', clientName: '5688', location: '台北', status: '進行中' }
                        ];
                        setActivities(defaultActs);
                        
                        let allTasks = [];
                        defaultActs.forEach(act => {
                            SURVEY_TEMPLATE.forEach((t, i) => allTasks.push({ id: `${act.id}_s_${i}`, activityId: act.id, ...t, type: 'SURVEY', status: 0, isApplicable: true, assignee: '', dueDate: '', note: '' }));
                            ITEM_TEMPLATE.forEach((t, i) => allTasks.push({ id: `${act.id}_i_${i}`, activityId: act.id, ...t, type: 'ITEM', status: 0, isApplicable: true, assignee: '', dueDate: '', note: '' }));
                        });
                        setTasks(allTasks);
                        setLoading(false);
                    }, 800);
                }
            };

            const handleLogin = (u, p) => {
                if(!u) return setError('請輸入帳號');
                setLoading(true);
                setTimeout(() => {
                    const mockUser = { name: u, role: 'admin' };
                    setUser(mockUser);
                    fetchData(mockUser);
                }, 500);
            };

            const handleUpdate = async (tId, updates) => {
                setTasks(prev => prev.map(t => t.id === tId ? { ...t, ...updates } : t));
                await callGAS({ action: 'updateTask', taskId: tId, ...updates });
            };

            const handleCreate = async () => {
                if(!form.name) return;
                setLoading(true);
                await callGAS({ action: 'createActivity', ...form, manager: user.name });
                const newActId = 'ACT-' + Date.now();
                const newAct = { id: newActId, name: form.name, clientName: form.clientName || '新客戶', location: form.location, status: '籌備中' };
                
                // 強制導入完整範本
                let newTasks = [];
                SURVEY_TEMPLATE.forEach((t, i) => newTasks.push({ id: `${newActId}_s_${i}`, activityId: newActId, ...t, type: 'SURVEY', status: 0, isApplicable: true, assignee: '', dueDate: '', note: '' }));
                ITEM_TEMPLATE.forEach((t, i) => newTasks.push({ id: `${newActId}_i_${i}`, activityId: newActId, ...t, type: 'ITEM', status: 0, isApplicable: true, assignee: '', dueDate: '', note: '' }));

                setTimeout(() => { 
                    setActivities(prev => [newAct, ...prev]);
                    setTasks(prev => [...prev, ...newTasks]);
                    setIsCreateOpen(false); 
                    setForm({name:'',clientName:'',startDate:'',endDate:'', location:''}); 
                    setLoading(false);
                }, 800);
            };

            const handleCreateTask = async (actId, taskData) => {
                const newId = 't' + Date.now();
                const newTask = { id: newId, activityId: actId, code: taskData.code, name: taskData.name, type: taskData.type, status: 0, isApplicable: true, assignee: '', note: '', dueDate: '' };
                setTasks(prev => [...prev, newTask]);
                await callGAS({ action: 'createTask', ...newTask });
            };

            const handleStatusChange = (actId, newStatus) => {
                setActivities(prev => prev.map(a => a.id === actId ? { ...a, status: newStatus } : a));
            };

            const handleDelete = async (actId) => {
                if(!confirm('確定刪除此專案？')) return;
                setLoading(true);
                await callGAS({ action: 'deleteActivity', activityId: actId });
                setActivities(prev => prev.filter(a => a.id !== actId));
                setLoading(false);
            };

            const getProgress = (actId) => {
                const actTasks = tasks.filter(t => t.activityId === actId);
                const subTasks = actTasks.filter(c => c.isApplicable && String(c.code).includes('.'));
                if (subTasks.length > 0) {
                    const sum = subTasks.reduce((s, t) => s + (Number(t.status) || 0), 0);
                    return Math.round(sum / subTasks.length);
                }
                return 0;
            };

            const DetailModal = ({ actId, onCreateTask }) => {
                const data = useMemo(() => {
                    const actTasks = tasks.filter(t => t.activityId === actId);
                    const subTasks = actTasks.filter(c => c.isApplicable && String(c.code).includes('.'));
                    let prog = 0;
                    if (subTasks.length > 0) {
                        const sum = subTasks.reduce((s, t) => s + (Number(t.status) || 0), 0);
                        prog = Math.round(sum / subTasks.length);
                    }
                    return { progress: prog, allTasks: actTasks };
                }, [actId, tasks]);

                const surveyTasks = data.allTasks.filter(t => t.type === 'SURVEY');
                const itemTasks = data.allTasks.filter(t => t.type === 'ITEM');

                const [isAdding, setIsAdding] = useState(false);
                const [newTask, setNewTask] = useState({ type: 'SURVEY', code: '', name: '' });

                const submitTask = () => {
                    if(!newTask.code || !newTask.name) return alert('請輸入代碼與名稱');
                    onCreateTask(actId, newTask);
                    setIsAdding(false);
                    setNewTask({ type: 'SURVEY', code: '', name: '' });
                };

                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-md">
                        <div className="bg-white w-full h-full sm:h-[90vh] sm:max-w-5xl sm:rounded-[2rem] shadow-2xl flex flex-col overflow-hidden animate-in slide-in-from-bottom-10">
                            <div className="px-4 py-3 sm:px-8 sm:py-5 border-b flex justify-between items-center bg-white z-10 shadow-sm">
                                <div className="flex items-center gap-3">
                                    <div className="p-2 bg-slate-100 rounded-xl hidden sm:block"><i data-lucide="layers" className="text-impr-orange w-5 h-5"></i></div>
                                    <div><h3 className="text-lg sm:text-xl font-black text-slate-800 italic tracking-tight">任務明細</h3><p className="text-xs text-slate-400 font-bold">總進度：<span className="text-impr-orange font-black text-sm">{data.progress}%</span></p></div>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => setIsAdding(!isAdding)} className="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold hover:bg-slate-700 flex items-center gap-1 transition-colors"><i data-lucide="plus" className="w-3 h-3"></i> 新增任務</button>
                                    <button onClick={()=>setSelAct(null)} className="w-9 h-9 flex items-center justify-center bg-slate-100 rounded-full text-slate-500 hover:bg-slate-200 transition-colors"><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                            </div>
                            {isAdding && (
                                <div className="p-4 bg-slate-50 border-b border-slate-200 grid grid-cols-1 sm:grid-cols-12 gap-3 items-end animate-in slide-in-from-top-2">
                                    <div className="sm:col-span-3"><label className="text-[10px] font-bold text-slate-400 mb-1 block">類型</label><select className="w-full p-2 text-xs rounded-lg border font-bold outline-none" value={newTask.type} onChange={e => setNewTask({...newTask, type: e.target.value})}><option value="SURVEY">場勘查核 (Survey)</option><option value="ITEM">專案籌備 (Item)</option></select></div>
                                    <div className="sm:col-span-2"><label className="text-[10px] font-bold text-slate-400 mb-1 block">代碼</label><input type="text" className="w-full p-2 text-xs rounded-lg border font-bold outline-none" placeholder="如 3.1" value={newTask.code} onChange={e => setNewTask({...newTask, code: e.target.value})} /></div>
                                    <div className="sm:col-span-5"><label className="text-[10px] font-bold text-slate-400 mb-1 block">任務名稱</label><input type="text" className="w-full p-2 text-xs rounded-lg border font-bold outline-none" placeholder="輸入任務名稱..." value={newTask.name} onChange={e => setNewTask({...newTask, name: e.target.value})} /></div>
                                    <div className="sm:col-span-2 flex gap-2"><button onClick={submitTask} className="flex-1 py-2 bg-impr-orange text-white text-xs font-bold rounded-lg hover:bg-orange-600">確認</button><button onClick={() => setIsAdding(false)} className="px-3 py-2 bg-white border text-xs font-bold rounded-lg text-slate-500 hover:bg-slate-50">取消</button></div>
                                </div>
                            )}
                            <div className="flex-1 overflow-y-auto p-4 sm:p-8 bg-slate-50/50 no-scrollbar space-y-8 pb-20">
                                <div><h4 className="text-xs font-black text-slate-500 uppercase tracking-[0.2em] mb-4 pl-2 border-l-4 border-impr-orange">場勘查核 (Survey)</h4><TaskHierarchy tasks={surveyTasks} onUpdate={handleUpdate} /></div>
                                <div><h4 className="text-xs font-black text-slate-500 uppercase tracking-[0.2em] mb-4 pl-2 border-l-4 border-blue-500">專案籌備 (Item)</h4><TaskHierarchy tasks={itemTasks} onUpdate={handleUpdate} /></div>
                            </div>
                        </div>
                    </div>
                );
            };

            const filteredActivities = useMemo(() => {
                return activities.filter(act => {
                    const isHistory = ['已完工', '結案'].includes(act.status);
                    return viewTab === 'history' ? isHistory : !isHistory;
                });
            }, [activities, viewTab]);

            if (!user) return <LoginPage onLogin={handleLogin} loading={loading} error={error} />;

            return (
                <div className="flex h-screen bg-white overflow-hidden">
                    {sidebarOpen && <div className="fixed inset-0 bg-black/50 z-40 md:hidden" onClick={() => setSidebarOpen(false)}></div>}
                    <div className={`sidebar-fixed bg-impr-dark flex flex-col text-white shadow-2xl p-6 ${sidebarOpen ? 'sidebar-open' : ''}`}>
                        <div className="flex flex-col items-center mb-8 pt-4">
                            {!sidebarImgError ? <img src={logoUrl} className="h-12 mb-2 object-contain" onError={() => setSidebarImgError(true)} alt="Sidebar Logo" /> : <div className="p-2 bg-white/10 rounded-xl border border-white/20 mb-2">{IMPR_LOGO_SVG("w-8 h-8")}</div>}
                            <div className="text-center"><span className="font-black text-xl text-white mt-2 italic tracking-tighter">IMPR HUB</span></div>
                        </div>
                        <nav className="flex-1 space-y-2">
                            {['dashboard', 'calendar', 'team', 'reports', 'settings'].map(page => (
                                <button key={page} onClick={() => { setActivePage(page); setSidebarOpen(false); }} className={`w-full p-3.5 rounded-2xl font-black text-sm flex items-center gap-3 cursor-pointer transition-all text-left ${activePage === page ? 'bg-impr-orange text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    <i data-lucide={page === 'dashboard' ? 'layout-dashboard' : page === 'calendar' ? 'calendar-days' : page === 'team' ? 'users' : page === 'reports' ? 'file-bar-chart-2' : 'settings'} className="w-5 h-5"></i> 
                                    {page === 'dashboard' ? '專案管考看板' : page === 'calendar' ? '專案行事曆' : page === 'team' ? '團隊成員管理' : page === 'reports' ? '數據分析報表' : '系統參數設定'}
                                </button>
                            ))}
                        </nav>
                        <div className="mt-auto border-t border-slate-800 pt-6">
                            <button onClick={()=>setUser(null)} className="w-full py-3.5 border border-slate-700 rounded-2xl text-[10px] font-black text-slate-400 hover:text-white transition-all flex items-center justify-center gap-2"><i data-lucide="log-out" className="w-3.5 h-3.5 text-rose-500"></i> 登出</button>
                        </div>
                    </div>

                    <div className="content-area flex flex-col h-full bg-slate-50 overflow-hidden">
                        <header className="px-5 py-4 sm:px-10 sm:py-8 bg-white border-b flex justify-between items-center sticky top-0 z-30 shadow-sm">
                            <div className="flex items-center gap-3"><button onClick={() => setSidebarOpen(true)} className="md:hidden text-slate-500"><i data-lucide="menu" className="w-6 h-6"></i></button><h1 className="text-lg sm:text-2xl font-black text-slate-800 tracking-tighter italic">{activePage === 'dashboard' ? '管考看板' : activePage === 'team' ? '團隊管理' : activePage === 'calendar' ? '專案行事曆' : activePage === 'reports' ? '數據報表' : '系統設定'}</h1></div>
                            {activePage === 'dashboard' && <button onClick={()=>setIsCreateOpen(true)} className="px-4 py-2 sm:px-6 sm:py-3 bg-impr-orange text-white rounded-xl sm:rounded-2xl font-black text-xs sm:text-sm shadow-xl active:scale-95 transition-all flex items-center gap-2"><i data-lucide="plus" className="w-4 h-4"></i> <span className="hidden sm:inline">新增專案</span><span className="sm:hidden">新增</span></button>}
                        </header>
                        <main className="flex-1 overflow-auto p-4 sm:p-10 no-scrollbar">
                            {activePage === 'dashboard' ? (
                                <>
                                    <DashboardStats activities={activities} />
                                    <div className="flex items-center gap-2 sm:gap-4 mb-6 overflow-x-auto pb-2">
                                        <button onClick={()=>setViewTab('active')} className={`flex-shrink-0 px-4 py-2 sm:px-6 sm:py-2.5 rounded-xl text-xs sm:text-sm font-black transition-all ${viewTab==='active' ? 'bg-slate-800 text-white shadow-lg' : 'bg-white text-slate-400'}`}>🚀 執行中</button>
                                        <button onClick={()=>setViewTab('history')} className={`flex-shrink-0 px-4 py-2 sm:px-6 sm:py-2.5 rounded-xl text-xs sm:text-sm font-black transition-all ${viewTab==='history' ? 'bg-slate-800 text-white shadow-lg' : 'bg-white text-slate-400'}`}>📦 歷史歸檔</button>
                                    </div>
                                    <div className="grid grid-cols-1 gap-4 sm:gap-6">
                                        {filteredActivities.length === 0 ? <div className="text-center py-20 text-slate-400 bg-white rounded-3xl border border-dashed border-slate-200"><i data-lucide="inbox" className="w-10 h-10 mx-auto mb-2 opacity-20"></i>{viewTab === 'active' ? '暫無專案' : '尚無歸檔資料'}</div> : filteredActivities.map(act => (
                                            <div key={act.id} className="bg-white rounded-2xl sm:rounded-[2.5rem] border border-slate-200 shadow-sm p-5 sm:p-8 flex flex-col md:flex-row gap-6 hover:border-impr-orange/30 transition-all">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <select value={act.status} onChange={(e) => handleStatusChange(act.id, e.target.value)} className={`px-2 py-1 rounded-lg text-[10px] font-black border uppercase tracking-widest outline-none cursor-pointer ${['已完工','結案'].includes(act.status) ? 'bg-slate-100 text-slate-500' : 'bg-blue-50 text-blue-600 border-blue-100'}`}><option value="籌備中">籌備中</option><option value="進行中">進行中</option><option value="已完工">已完工</option><option value="結案">結案</option></select>
                                                    </div>
                                                    <h2 className="text-lg sm:text-xl font-black text-slate-800 mb-2 tracking-tight">{act.name}</h2>
                                                    <div className="flex flex-wrap items-center gap-3 text-xs font-bold text-slate-400"><span className="flex items-center gap-1"><i data-lucide="briefcase" className="w-3 h-3"></i> {act.clientName}</span><span className="flex items-center gap-1"><i data-lucide="map-pin" className="w-3 h-3"></i> {act.location || '未填寫'}</span></div>
                                                </div>
                                                <div className="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-8 pt-4 sm:pt-0 border-t sm:border-0 border-slate-50">
                                                    <div className="flex flex-col items-end gap-1 w-full sm:w-auto"><div className="flex items-center gap-3 w-full sm:w-auto"><div className="flex-1 sm:flex-none w-auto sm:w-24 h-2 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-impr-orange" style={{width: `${getProgress(act.id)}%`}}></div></div><span className="text-sm font-black text-slate-500 font-mono">{getProgress(act.id)}%</span></div></div>
                                                    <div className="flex gap-2"><button onClick={()=>setSelAct(act.id)} className="flex-1 sm:flex-none px-6 py-3 bg-slate-900 text-white rounded-xl text-xs font-black shadow-lg">管考明細</button><button onClick={()=>handleDelete(act.id)} className="w-10 h-10 flex items-center justify-center border border-slate-200 text-slate-400 rounded-xl hover:text-red-500 hover:bg-red-50"><i data-lucide="trash-2" className="w-4 h-4"></i></button></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            ) : activePage === 'team' ? <TeamManager /> : (
                                <div className="flex flex-col items-center justify-center h-96 text-slate-400 bg-white rounded-3xl border border-slate-200 border-dashed"><i data-lucide="construction" className="w-16 h-16 mb-4 text-slate-200"></i><p className="font-bold text-lg">功能開發中</p><p className="text-xs mt-2">此模組尚未啟用</p></div>
                            )}
                        </main>
                    </div>

                    {isCreateOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={(e) => { if(e.target === e.currentTarget) setIsCreateOpen(false); }}>
                            <div className="bg-white w-full max-w-md p-6 sm:p-8 rounded-3xl shadow-2xl animate-in zoom-in-95">
                                <h3 className="font-bold text-lg mb-4">新增專案</h3>
                                <div className="space-y-3">
                                    <input type="text" placeholder="客戶名稱" className="w-full p-3 border rounded-xl font-bold text-sm" onChange={e=>setForm({...form, clientName: e.target.value})}/>
                                    <input type="text" placeholder="專案名稱" className="w-full p-3 border rounded-xl font-bold text-sm" onChange={e=>setForm({...form, name: e.target.value})}/>
                                    <input type="text" placeholder="活動地點" className="w-full p-3 border rounded-xl font-bold text-sm" onChange={e=>setForm({...form, location: e.target.value})}/>
                                    <div className="flex gap-3"><input type="date" className="w-1/2 p-3 border rounded-xl text-sm" onChange={e=>setForm({...form, startDate: e.target.value})}/><input type="date" className="w-1/2 p-3 border rounded-xl text-sm" onChange={e=>setForm({...form, endDate: e.target.value})}/></div>
                                </div>
                                <div className="flex gap-3 mt-6"><button onClick={()=>setIsCreateOpen(false)} className="flex-1 py-3 bg-slate-100 font-bold rounded-xl text-slate-500">取消</button><button onClick={handleCreate} disabled={loading} className="flex-1 py-3 bg-impr-orange text-white font-bold rounded-xl shadow-lg">{loading?"建立中...":"建立"}</button></div>
                            </div>
                        </div>
                    )}
                    {selAct && <DetailModal actId={selAct} onCreateTask={handleCreateTask} />}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
