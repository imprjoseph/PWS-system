<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>impr 專案管考系統 - 企業版</title>
    <!-- 載入核心庫 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        impr: {
                            orange: '#F28C00',
                            dark: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        
        /* 強制限制 Logo 尺寸 */
        .company-logo {
            max-width: 200px !important;
            max-height: 80px !important;
            width: auto;
            height: auto;
            object-fit: contain;
            margin: 0 auto;
        }

        .sidebar-fixed {
            width: 260px;
            flex-shrink: 0;
        }

        .content-area {
            flex: 1;
            min-width: 0;
        }

        input:focus {
            border-color: #F28C00 !important;
            box-shadow: 0 0 0 3px rgba(242, 140, 0, 0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // ==========================================
        // --- 連線設定區 ---
        // ==========================================
        const USE_MOCK_DATA = false; 
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxocYjhfwtsgbUwaAC2c9JFbznjb9nWmz290E7RR4RJ3rN2cJ1JE3_Ja63QGTPiG7C9/exec";
        const logoUrl = "logo.png";

        const callGAS = async (payload) => {
            const response = await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify(payload) });
            return await response.json();
        };

        // ==========================================
        // 1. 子組件
        // ==========================================

        const LoginPage = ({ u, setU, p, setP, onLogin, loading, error }) => (
            <div className="min-h-screen flex items-center justify-center bg-slate-50 p-6 relative">
                <div className="w-full max-w-[400px] z-10">
                    <div className="bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 p-10 overflow-hidden">
                        <div className="text-center mb-8">
                            {/* Logo 顯示區：移除多餘文字，只顯示圖片 */}
                            <div className="flex justify-center items-center h-20 mb-2">
                                <img src={logoUrl} className="company-logo" onError={(e) => { e.target.src = 'https://via.placeholder.com/200x60?text=impr'; }} />
                            </div>
                            <h2 className="text-2xl font-black text-slate-800 tracking-tight">專案管考自動化系統</h2>
                            <p className="text-slate-400 text-[10px] uppercase tracking-widest mt-1">Strategic Project Management</p>
                        </div>
                        <form onSubmit={onLogin} className="space-y-5">
                            <input type="text" value={u} onChange={e => setU(e.target.value)} className="w-full px-5 py-4 bg-slate-50 border rounded-xl outline-none font-bold text-slate-700" placeholder="帳號" />
                            <input type="password" value={p} onChange={e => setP(e.target.value)} className="w-full px-5 py-4 bg-slate-50 border rounded-xl outline-none font-bold text-slate-700" placeholder="密碼" />
                            {error && <div className="text-xs text-red-500 font-bold bg-red-50 p-2 rounded border border-red-100">{error}</div>}
                            <button type="submit" disabled={loading} className="w-full py-4 bg-impr-orange text-white rounded-xl font-black shadow-lg hover:bg-orange-600 transition-all">
                                {loading ? "驗證中..." : "登入系統"}
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        );

        const CreateActivityModal = ({ isOpen, onClose, onCreate, loading, form, setForm }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 border border-white fade-in">
                        <h3 className="text-xl font-black text-slate-800 mb-6 italic tracking-tight">新增專案計畫</h3>
                        <div className="space-y-4">
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">客戶名稱 <span className="text-red-500">*</span></label>
                                <input type="text" placeholder="請輸入客戶名稱" value={form.clientName} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-impr-orange font-bold text-slate-800" 
                                       onChange={e => setForm({...form, clientName: e.target.value})} />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">專案名稱 <span className="text-red-500">*</span></label>
                                <input type="text" placeholder="例如：2025 全球電子展" value={form.name} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-impr-orange font-bold text-slate-800"
                                       onChange={e => setForm({...form, name: e.target.value})} />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">開始日</label>
                                    <input type="date" value={form.startDate} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-sm"
                                           onChange={e => setForm({...form, startDate: e.target.value})} />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">結束日</label>
                                    <input type="date" value={form.endDate} className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-sm"
                                           onChange={e => setForm({...form, endDate: e.target.value})} />
                                </div>
                            </div>
                        </div>
                        <div className="mt-8 flex gap-3">
                            <button onClick={onClose} className="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl hover:bg-slate-200 transition-all">取消</button>
                            <button onClick={onCreate} disabled={loading} className="flex-1 py-3 bg-impr-orange text-white font-black rounded-xl shadow-lg hover:bg-orange-600 transition-all">
                                {loading ? "生成任務範本中..." : "確認新增"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const DetailModal = ({ actId, onClose, progressData, onUpdate, loading }) => {
            const data = progressData[actId];
            if (!data) return null;

            const TaskGroup = ({ title, type, icon }) => {
                const groupTasks = data.allTasks.filter(t => t.type === type);
                return (
                    <div className="bg-white border rounded-2xl overflow-hidden shadow-sm mb-6">
                        <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
                            <div className="flex items-center gap-2 font-black text-sm text-slate-700">
                                <i data-lucide={icon} className="w-4 h-4 text-impr-orange"></i> {title}
                            </div>
                            <span className="text-[10px] font-bold text-slate-400">{groupTasks.length} 項</span>
                        </div>
                        <div className="p-2">
                            <table className="w-full text-xs">
                                <tbody className="divide-y divide-slate-50">
                                    {groupTasks.length === 0 ? (
                                        <tr><td className="p-4 text-center text-slate-300">尚未建立此類任務，請檢查範本設定</td></tr>
                                    ) : groupTasks.map(t => (
                                        <tr key={t.id} className={`hover:bg-slate-50 transition-colors ${!t.isApplicable ? 'opacity-40 bg-slate-100' : ''}`}>
                                            <td className="p-3 font-mono text-slate-300 w-10 font-bold">{t.code}</td>
                                            <td className="p-3">
                                                <div className={`font-bold ${t.isApplicable ? 'text-slate-700' : 'line-through text-slate-400'}`}>{t.name}</div>
                                                <div className="text-[9px] text-slate-400 uppercase mt-0.5">PIC: {t.assignee}</div>
                                            </td>
                                            <td className="p-3 text-right flex gap-2 justify-end">
                                                <button onClick={() => onUpdate(t.id, undefined, !t.isApplicable)} className={`px-2 py-1 rounded text-[9px] font-black border transition-all ${t.isApplicable ? 'text-slate-400 border-slate-200 hover:border-slate-800' : 'bg-slate-800 text-white border-slate-800'}`}>
                                                    {t.isApplicable ? "標記 N/A" : "恢復適用"}
                                                </button>
                                                {t.isApplicable && (
                                                    <button onClick={() => onUpdate(t.id, t.status == 100 ? 0 : 100)} className={`px-3 py-1 rounded text-[9px] font-black transition-all ${t.status == 100 ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-900 text-white'}`}>
                                                        {t.status == 100 ? "已完成" : "回報"}
                                                    </button>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            return (
                <div className="fixed inset-0 z-[130] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white w-full max-w-4xl max-h-[85vh] rounded-[2.5rem] shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95">
                        <div className="p-6 border-b flex justify-between items-center bg-white">
                            <div>
                                <h3 className="text-xl font-black text-slate-800 tracking-tight">專案管考明細表</h3>
                                <p className="text-[10px] text-slate-400 mt-1 uppercase">排除 N/A 後目前進度：<span className="text-impr-orange font-black text-sm">{data.progress}%</span></p>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-lg transition-colors"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-6 bg-slate-50/30 no-scrollbar">
                            <TaskGroup title="場勘查核 (Survey)" type="SURVEY" icon="map-pin" />
                            <TaskGroup title="專案籌備 (Item)" type="ITEM" icon="list-checks" />
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 2. 主程式 App
        // ==========================================

        const App = () => {
            const [user, setUser] = useState(null);
            const [activities, setActivities] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(false);
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const [error, setError] = useState('');
            const [isCreateOpen, setIsCreateOpen] = useState(false);
            const [selAct, setSelAct] = useState(null);
            const [form, setForm] = useState({ name: '', clientName: '', startDate: '', endDate: '' });

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            const fetchData = async (curr) => {
                setLoading(true);
                try {
                    const res = await callGAS({ action: 'getData', role: curr.role, name: curr.name });
                    if (res.status === 'success') { setActivities(res.activities); setTasks(res.tasks); }
                } catch { console.error("Sync Failed"); }
                setLoading(false);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const res = await callGAS({ action: 'login', username: u, password: p });
                    if (res.status === 'success') { setUser(res.user); await fetchData(res.user); }
                    else setError(res.message);
                } catch { setError('連線失敗'); }
                setLoading(false);
            };

            const handleUpdate = async (tId, status, isApplicable) => {
                setLoading(true);
                const res = await callGAS({ action: 'updateTask', taskId: tId, status, isApplicable });
                if (res.status === 'success') await fetchData(user);
                setLoading(false);
            };

            const handleCreate = async () => {
                if (!form.name || !form.clientName) {
                    alert('請填寫 專案名稱 與 客戶名稱');
                    return;
                }
                setLoading(true);
                const res = await callGAS({ action: 'createActivity', ...form, manager: user.name });
                if (res.status === 'success') { 
                    // 延遲 1.5 秒再讀取，確保 GAS 已寫入任務
                    setTimeout(async () => {
                        await fetchData(user); 
                        setIsCreateOpen(false); 
                        setForm({ name: '', clientName: '', startDate: '', endDate: '' });
                    }, 1500);
                }
                setLoading(false);
            };

            const progressData = useMemo(() => {
                const map = {};
                activities.forEach(a => {
                    const aTasks = tasks.filter(t => t.activityId === a.id);
                    const applicableTasks = aTasks.filter(t => t.isApplicable !== false);
                    const completed = applicableTasks.filter(t => t.status == 100).length;
                    const prog = applicableTasks.length > 0 ? Math.round((completed / applicableTasks.length) * 100) : 0;
                    map[a.id] = { progress: prog, allTasks: aTasks };
                });
                return map;
            }, [activities, tasks]);

            if (!user) return <LoginPage u={u} setU={setU} p={p} setP={setP} onLogin={handleLogin} loading={loading} error={error} />;

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden">
                    <div className="sidebar-fixed bg-impr-dark flex flex-col text-white shadow-2xl">
                        <div className="p-10 text-center border-b border-white/5 bg-slate-900/40">
                            {/* 側邊欄 Logo：移除文字，只保留圖片 */}
                            <div className="bg-white p-2 rounded-2xl inline-block shadow-lg mb-4">
                                <img src={logoUrl} className="h-10 w-auto" onError={(e) => { e.target.src = 'https://via.placeholder.com/100x40?text=impr'; }} />
                            </div>
                            <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest mt-2">Enterprise Hub</p>
                        </div>
                        <nav className="flex-1 p-6 space-y-3 mt-6">
                            <div className="bg-impr-orange p-5 rounded-2xl font-bold flex items-center gap-3 shadow-xl">
                                <i data-lucide="layout-dashboard" className="w-5 h-5"></i> 專案儀表板
                            </div>
                        </nav>
                        <div className="p-8">
                            <p className="text-[10px] text-slate-500 font-black uppercase mb-1">Signed in as</p>
                            <p className="text-sm font-bold truncate mb-4">{user.name}</p>
                            <button onClick={() => setUser(null)} className="w-full py-3 bg-red-500/10 text-red-400 rounded-xl font-black text-[10px] uppercase border border-red-500/20 hover:bg-red-500 hover:text-white transition-all">登出系統</button>
                        </div>
                    </div>

                    <div className="content-area flex flex-col h-full bg-slate-50 overflow-hidden">
                        <header className="px-10 py-8 flex items-center justify-between border-b bg-white/80 backdrop-blur-sm">
                            <h1 className="text-2xl font-black text-slate-800 tracking-tighter italic uppercase">
                                {user.role === 'admin' ? '管理者管考視窗' : '專案同仁工作台'}
                            </h1>
                            <div className="flex items-center gap-3 px-5 py-2.5 bg-slate-50 rounded-2xl text-[12px] font-black text-slate-500 border border-slate-100">
                                <i data-lucide="clock" className="w-4 h-4 text-impr-orange"></i> {new Date().toLocaleDateString('zh-TW')}
                            </div>
                        </header>

                        <main className="flex-1 overflow-auto p-10 no-scrollbar">
                            <div className="max-w-5xl mx-auto space-y-10">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-gradient-to-br from-impr-orange to-orange-600 p-8 rounded-[2.5rem] shadow-xl text-white relative overflow-hidden group">
                                        <p className="text-[11px] font-black uppercase opacity-70 tracking-widest">進行中專案</p>
                                        <h4 className="text-6xl font-black mt-2 tracking-tighter">{activities.filter(a => a.status !== '已完成').length}</h4>
                                        <i data-lucide="target" className="absolute right-[-10px] bottom-[-10px] w-24 h-24 opacity-10 group-hover:scale-110 transition-transform"></i>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                                        <p className="text-[11px] font-black text-slate-400 uppercase tracking-widest">年度專案總數</p>
                                        <h4 className="text-6xl font-black mt-2 text-slate-800 tracking-tighter">{activities.length}</h4>
                                    </div>
                                    <div className="bg-slate-800 p-8 rounded-[2.5rem] shadow-xl text-white relative">
                                        <p className="text-[11px] font-black uppercase opacity-70 tracking-widest">團隊平均進度</p>
                                        <h4 className="text-6xl font-black mt-2 tracking-tighter">
                                            {activities.length > 0 ? Math.round(Object.values(progressData).reduce((s,i) => s+i.progress, 0) / activities.length) : 0}%
                                        </h4>
                                    </div>
                                </div>

                                <div className="bg-white rounded-[3rem] shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-10 border-b border-slate-50 flex flex-col md:flex-row md:items-center justify-between gap-6 bg-slate-50/20">
                                        <h3 className="text-xl font-black text-slate-800 tracking-tight italic">專案執行進度清單</h3>
                                        {user.role === 'admin' && (
                                            <button onClick={() => setIsCreateOpen(true)} className="flex items-center gap-2 px-8 py-4 bg-impr-orange text-white font-black rounded-2xl hover:bg-orange-600 shadow-xl transition-all text-sm group">
                                                <i data-lucide="plus" className="w-5 h-5 group-hover:rotate-90 transition-transform"></i> 新增專案
                                            </button>
                                        )}
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left">
                                            <thead>
                                                <tr className="text-[10px] font-black uppercase tracking-widest text-slate-400 border-b bg-slate-50/50">
                                                    <th className="px-10 py-5">專案資訊 (名稱/客戶)</th>
                                                    <th className="px-8 py-5 text-center">當前狀態</th>
                                                    <th className="px-10 py-5">管考進度</th>
                                                    <th className="px-10 py-5 text-right">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {activities.length === 0 ? (
                                                    <tr><td colSpan="4" className="p-20 text-center text-slate-300 font-bold uppercase italic">{loading ? "同步資料庫中..." : "尚未有專案資料"}</td></tr>
                                                ) : activities.map(act => (
                                                    <tr key={act.id} className="hover:bg-slate-50/80 transition-all group">
                                                        <td className="px-10 py-8">
                                                            <div className="font-black text-slate-700 text-lg group-hover:text-impr-orange transition-colors">{act.name}</div>
                                                            <div className="text-[10px] font-bold text-slate-400 mt-1.5 uppercase flex gap-3 items-center">
                                                                <span className="bg-slate-100 px-2 py-0.5 rounded text-slate-600">CLIENT: {act.clientName || 'N/A'}</span>
                                                                <span className="italic">ID: {act.id}</span>
                                                            </div>
                                                        </td>
                                                        <td className="px-8 py-8 text-center">
                                                            <span className={`px-4 py-1.5 rounded-full text-[9px] font-black border uppercase tracking-widest ${act.status === '進行中' ? 'bg-blue-50 text-blue-600 border-blue-100' : 'bg-orange-50 text-impr-orange border-orange-100'}`}>
                                                                {act.status}
                                                            </span>
                                                        </td>
                                                        <td className="px-10 py-8">
                                                            <div className="flex items-center gap-4">
                                                                <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden shadow-inner">
                                                                    <div className="h-full bg-gradient-to-r from-orange-400 to-impr-orange transition-all duration-1000" style={{width: `${progressData[act.id]?.progress || 0}%`}}></div>
                                                                </div>
                                                                <span className="text-[12px] font-black text-slate-600 font-mono w-8 text-right">{progressData[act.id]?.progress || 0}%</span>
                                                            </div>
                                                        </td>
                                                        <td className="px-10 py-8 text-right">
                                                            <button onClick={() => setSelAct(act.id)} className="px-6 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-400 font-black text-[11px] uppercase hover:bg-slate-800 hover:text-white transition-all shadow-sm">Details</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    <CreateActivityModal isOpen={isCreateOpen} loading={loading} form={form} setForm={setForm} onClose={() => setIsCreateOpen(false)} onCreate={handleCreate} />
                    {selAct && <DetailModal actId={selAct} onClose={() => setSelAct(null)} progressData={progressData} onUpdate={handleUpdate} loading={loading} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
