<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>impr 專案管考系統 - 企業旗艦版</title>
    <!-- 載入 React 與 Babel (用於解析 JSX) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 載入 Tailwind CSS (CDN 版) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Lucide 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        // Tailwind 顏色配置
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        impr: {
                            orange: '#F28C00',
                            dark: '#0f172a',
                        }
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                        '4xl': '2rem',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        /* 隱藏捲軸但保持功能 */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // ==========================================
        // --- 設定區 ---
        // ==========================================
        // 1. 正式連結時請改為 false
        const USE_MOCK_DATA = false; 
        // 2. 貼上您在 Google Apps Script 部署後的 Web App URL
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzeurryJ4gtk2EHdcDTbeGDbTXO7exOmh1qUZ_tlcp8VD6FfPdnMV9G_xPMG2881DjQ/exec";     
        const logoUrl = "logo.png";

        // --- 核心連線函式 (含重試機制) ---
        const callGAS = async (payload, retries = 5, delay = 1000) => {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(GAS_API_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2; // 指數退避
                }
            }
        };

        // --- 輔助功能 ---
        const isDelayed = (task) => {
            if (!task.dueDate || Number(task.status) === 100) return false;
            return new Date() > new Date(task.dueDate);
        };

        // ==========================================
        // 子組件
        // ==========================================

        const LoginPage = ({ username, setUsername, password, setPassword, handleLogin, loading, error }) => (
            <div className="min-h-screen flex items-center justify-center bg-slate-50 relative p-6">
                <div className="absolute inset-0 overflow-hidden pointer-events-none">
                    <div className="absolute -top-24 -right-24 w-96 h-96 bg-orange-100 rounded-full blur-[100px] opacity-60"></div>
                    <div className="absolute -bottom-24 -left-24 w-96 h-96 bg-blue-100 rounded-full blur-[100px] opacity-60"></div>
                </div>
                <div className="w-full max-w-[380px] z-10">
                    <div className="bg-white rounded-[2.5rem] shadow-2xl border border-white overflow-hidden">
                        <div className="p-10 pb-6 text-center">
                            <div className="flex justify-center mb-6">
                                <img src={logoUrl} className="h-14 w-auto" onError={(e) => e.target.src = 'https://via.placeholder.com/100?text=impr'} />
                            </div>
                            <h2 className="text-xl font-black text-slate-800 tracking-tight">專案管考自動化系統</h2>
                            <p className="text-slate-400 font-bold text-[9px] mt-2 uppercase tracking-[0.2em]">Strategic PR Management</p>
                        </div>
                        <form onSubmit={handleLogin} className="p-10 pt-0 space-y-4">
                            <div className="space-y-1.5">
                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Account</label>
                                <input type="text" value={username} onChange={(e) => setUsername(e.target.value)}
                                    className="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:border-impr-orange focus:bg-white outline-none font-bold text-slate-700 transition-all"
                                    placeholder="admin / staff" />
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Password</label>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:border-impr-orange focus:bg-white outline-none font-bold text-slate-700 transition-all"
                                    placeholder="密碼" />
                            </div>
                            {error && <div className="text-[11px] text-red-500 font-bold px-2">{error}</div>}
                            <button type="submit" disabled={loading} className="w-full py-4 bg-impr-orange text-white rounded-2xl font-black text-lg shadow-xl shadow-orange-600/20 hover:scale-[1.02] active:scale-[0.98] transition-all disabled:bg-slate-300 mt-2">
                                {loading ? "連線中..." : "進入系統"}
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        );

        const CreateActivityModal = ({ isOpen, onClose, onCreate, loading }) => {
            const [data, setData] = useState({ name: '', startDate: '', endDate: '' });
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                    <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 border border-white">
                        <h3 className="text-xl font-black text-slate-800 mb-6">啟動新顧問合約</h3>
                        <div className="space-y-4">
                            <input type="text" placeholder="合約/活動名稱" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-impr-orange font-bold"
                                   onChange={(e) => setData({...data, name: e.target.value})} />
                            <div className="grid grid-cols-2 gap-4">
                                <input type="date" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-sm"
                                       onChange={(e) => setData({...data, startDate: e.target.value})} />
                                <input type="date" className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none font-bold text-sm"
                                       onChange={(e) => setData({...data, endDate: e.target.value})} />
                            </div>
                        </div>
                        <div className="mt-8 flex gap-3">
                            <button onClick={onClose} className="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl">取消</button>
                            <button onClick={() => onCreate(data)} disabled={loading} className="flex-1 py-3 bg-impr-orange text-white font-black rounded-xl shadow-lg disabled:opacity-50">
                                {loading ? "處理中..." : "建立專案"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 主程式 App
        // ==========================================

        const App = () => {
            const [user, setUser] = useState(null);
            const [activities, setActivities] = useState([]);
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [isCreateOpen, setIsCreateOpen] = useState(false);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [user, activities]);

            // 抓取資料
            const fetchData = useCallback(async (currentUser) => {
                if (USE_MOCK_DATA) {
                    setActivities([{ id: 'A01', name: '2025 全球電子展公關專案', status: '進行中', manager: '專案總監', progress: 50 }]);
                    return;
                }
                try {
                    const res = await callGAS({ action: 'getData', role: currentUser.role, name: currentUser.name });
                    if (res.status === 'success') {
                        setActivities(res.activities);
                        setTasks(res.tasks);
                    }
                } catch (err) {
                    console.error("Fetch Data Error:", err);
                }
            }, []);

            // 登入處理
            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');

                if (USE_MOCK_DATA) {
                    setTimeout(() => {
                        if (username === 'admin' && password === '123') {
                            const u = { name: '專案總監', role: 'admin', username: 'admin' };
                            setUser(u);
                            fetchData(u);
                        } else {
                            setError('帳號或密碼錯誤 (Demo: admin/123)');
                        }
                        setLoading(false);
                    }, 800);
                    return;
                }

                try {
                    const res = await callGAS({ action: 'login', username, password });
                    if (res.status === 'success') {
                        setUser(res.user);
                        fetchData(res.user);
                    } else {
                        setError(res.message);
                    }
                } catch (err) {
                    setError('無法連線至後端資料庫，請檢查 GAS 網址');
                }
                setLoading(false);
            };

            // 建立專案處理
            const handleCreate = async (data) => {
                if (!data.name) return;
                setLoading(true);
                if (USE_MOCK_DATA) {
                    setActivities([...activities, { ...data, id: Date.now(), status: '洽談中', manager: user.name, progress: 0 }]);
                    setIsCreateOpen(false);
                } else {
                    try {
                        const res = await callGAS({ 
                            action: 'createActivity', 
                            name: data.name, 
                            startDate: data.startDate, 
                            endDate: data.endDate, 
                            manager: user.name 
                        });
                        if (res.status === 'success') {
                            await fetchData(user);
                            setIsCreateOpen(false);
                        }
                    } catch (err) {
                        alert('建立失敗，請稍後再試');
                    }
                }
                setLoading(false);
            };

            if (!user) return <LoginPage username={username} setUsername={setUsername} password={password} setPassword={setPassword} handleLogin={handleLogin} loading={loading} error={error} />;

            return (
                <div className="flex h-screen bg-slate-100 overflow-hidden">
                    {/* 側邊欄 */}
                    <div className="w-64 bg-impr-dark flex flex-col text-white shadow-2xl shrink-0">
                        <div className="p-8 text-center border-b border-white/5 bg-slate-900/50">
                            <img src={logoUrl} className="h-10 mx-auto mb-4" onError={(e) => e.target.style.display='none'} />
                            <div className="text-xl font-black tracking-tighter text-impr-orange">impr</div>
                            <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest mt-1">Enterprise Management</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 mt-4">
                            <div className="bg-impr-orange p-4 rounded-2xl font-bold flex items-center gap-3 shadow-lg cursor-pointer">
                                <span className="text-sm">總覽儀表板</span>
                            </div>
                        </nav>
                        <div className="p-6 mt-auto">
                            <button onClick={() => setUser(null)} className="w-full py-3 bg-red-500/10 text-red-400 rounded-xl font-black text-[10px] uppercase tracking-widest border border-red-500/20 hover:bg-red-500 hover:text-white transition-all">
                                登出系統
                            </button>
                        </div>
                    </div>

                    {/* 主內容區 */}
                    <div className="flex-1 flex flex-col h-full min-w-0 bg-slate-50 overflow-hidden">
                        <header className="px-10 py-10 flex items-center justify-between z-10">
                            <div>
                                <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em] mb-1">Navigation / Dashboard</p>
                                <h1 className="text-3xl font-black text-slate-800 tracking-tighter leading-none italic">管理者管考視窗</h1>
                            </div>
                            <div className="px-5 py-2.5 bg-white shadow-sm border border-slate-200 rounded-2xl text-[12px] font-black text-slate-500 font-mono">
                                {new Date().toLocaleDateString('zh-TW')}
                            </div>
                        </header>

                        <main className="flex-1 overflow-auto px-10 pb-16">
                            <div className="max-w-5xl mx-auto space-y-8">
                                {/* 統計卡片 */}
                                <div className="grid grid-cols-3 gap-6">
                                    <div className="bg-gradient-to-br from-impr-orange to-orange-600 p-8 rounded-[2.5rem] shadow-xl text-white">
                                        <p className="text-[10px] font-black uppercase opacity-70">進行中專案</p>
                                        <h4 className="text-5xl font-black mt-2 tracking-tighter">{activities.length}</h4>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                                        <p className="text-[10px] font-black text-slate-400 uppercase">延遲風險</p>
                                        <h4 className="text-5xl font-black mt-2 tracking-tighter text-rose-500">0</h4>
                                    </div>
                                    <div className="bg-slate-800 p-8 rounded-[2.5rem] shadow-xl text-white">
                                        <p className="text-[10px] font-black uppercase opacity-70">年度總件數</p>
                                        <h4 className="text-5xl font-black mt-2 tracking-tighter">{activities.length}</h4>
                                    </div>
                                </div>

                                {/* 清單表格 */}
                                <div className="bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-8 border-b border-slate-100 flex items-center justify-between bg-slate-50/10">
                                        <h3 className="text-lg font-black text-slate-800">顧問專案進度清單</h3>
                                        <button onClick={() => setIsCreateOpen(true)} className="flex items-center gap-2 px-6 py-3 bg-impr-orange text-white font-black rounded-2xl hover:bg-orange-600 shadow-lg shadow-orange-600/20 transition-all active:scale-95 text-sm">
                                            + 啟動新合約
                                        </button>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left">
                                            <thead>
                                                <tr className="text-[10px] font-black uppercase tracking-[0.1em] text-slate-400 border-b border-slate-50">
                                                    <th className="px-8 py-4">活動名稱</th>
                                                    <th className="px-8 py-4 text-center">狀態</th>
                                                    <th className="px-8 py-4">進度</th>
                                                    <th className="px-8 py-4 text-right">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {activities.length === 0 ? (
                                                    <tr><td colSpan="4" className="p-12 text-center text-slate-300 font-bold">載入中或尚無資料...</td></tr>
                                                ) : activities.map(act => (
                                                    <tr key={act.id} className="hover:bg-slate-50 transition-all">
                                                        <td className="px-8 py-6 font-black text-slate-700">{act.name}</td>
                                                        <td className="px-8 py-6 text-center"><span className="px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-[9px] font-black border border-blue-100">{act.status}</span></td>
                                                        <td className="px-8 py-6">
                                                            <div className="flex items-center gap-3">
                                                                <div className="w-24 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                                    <div className="h-full bg-impr-orange" style={{width: `${act.progress || 0}%`}}></div>
                                                                </div>
                                                                <span className="text-[10px] font-black text-slate-500 font-mono">{act.progress || 0}%</span>
                                                            </div>
                                                        </td>
                                                        <td className="px-8 py-6 text-right"><button className="text-[10px] font-black text-slate-400 uppercase hover:text-impr-orange">Details</button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    <CreateActivityModal isOpen={isCreateOpen} loading={loading} onClose={() => setIsCreateOpen(false)} onCreate={handleCreate} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
